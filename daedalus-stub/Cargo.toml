[package]
name = "daedalus-stub"
version = "0.5.0"
edition = "2021"
description = "daedalus launcher stub — self-extracting ELF that runs the embedded app"

[[bin]]
name = "daedalus-stub"
path = "src/main.rs"

[[bin]]
name = "daedalus-crypto"
path = "src/bin/daedalus-crypto.rs"

[dependencies]
# Shared core library (format parsing, constants).
daedalus-core = { path = "../daedalus-core" }
# Mostly pure-Rust: tar, sha2, serde, ed25519-dalek are all pure Rust.
# backhand (squashfs) pulls in zstd-sys which requires a C compiler (cc crate)
# at build time.  A C toolchain (gcc/musl-gcc) and pkg-config are therefore
# needed alongside the Rust toolchain.
# pkg-config are therefore needed alongside the Rust toolchain.
tar = "0.4"             # tar extraction
sha2 = "0.10"           # SHA-256 integrity check
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"            # config file parsing
dirs = "5"              # standard directories (config, cache, home)
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "zeroize"] }  # >= 2.1.0: CVE-2023-48022
rand = "0.8"
libc = "0.2"
zeroize = "1"           # secure memory zeroization for keys and secrets
backhand = { version = "0.25", default-features = false, features = ["gzip", "lz4", "zstd"] }  # squashfs extraction
hex = "0.4"               # hex encoding for cache keys
# ureq moved to target-specific section below (Linux-only)
tempfile = "3"            # temp files for macOS sandbox profiles
zstd = { version = "0.13", features = ["zstdmt"] }  # multithreaded zstd decompression for cold start
walkdir = "2"               # recursive directory scan for native libs
aes-gcm = "0.10"            # AES-256-GCM payload decryption
hkdf = "0.12"               # HKDF-SHA256 key derivation for decryption

# HTTP client for --daedalus-update: Linux-only (macOS lacks cross-compiled
# ring/rustls without SDK). Update feature falls back to disabled on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = "3"

[dev-dependencies]
daedalus-core = { path = "../daedalus-core" }
tempfile = "3"
tar = "0.4"
zstd = { version = "0.13", features = ["zstdmt"] }
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "std", "rand_core"] }  # >= 2.1.0: CVE-2023-48022

# zstd-sys 2.0.x compiles an x86_64-only assembly file unconditionally
# (zstd-sys build.rs:144). Disable it on every other arch so cross-builds
# (aarch64, arm, riscv64, ppc64le, …) can link. Scalar decompression path only.
[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
zstd-sys = { version = "2.0.16", features = ["no_asm"] }

[lints]
workspace = true
