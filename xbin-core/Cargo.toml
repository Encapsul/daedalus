[package]
name = "xbin-core"
version = "0.1.0"
edition = "2021"
description = "xbin core library — format, compression, runtime detection, package manager detection"

[lib]
name = "xbin_core"
path = "src/lib.rs"

[features]
default = []
python = ["pyo3"]

[dependencies]
# Format + integrity
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Compression
ruzstd = "0.7"          # zstd decompression (pure Rust, for reading)
zstd = "0.13"           # zstd compression (C bindings, for building)

# Tar archive creation
tar = "0.4"

# Python bindings (optional)
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "warn"
unwrap_used = "allow"
expect_used = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
items_after_statements = "allow"
format_push_string = "allow"
uninlined_format_args = "allow"
if_not_else = "allow"
manual_let_else = "allow"
io_other_error = "allow"
map_unwrap_or = "allow"
unnecessary_wraps = "allow"
single_match_else = "allow"
similar_names = "allow"
