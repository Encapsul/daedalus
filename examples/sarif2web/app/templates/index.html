<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARIF Findings Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ── Dracula Dark (default) ── */
:root,[data-theme="dark"]{
  --bg:#282a36;--bg2:#21222c;--bg3:#44475a;--bg4:#343746;
  --border:#6272a4;
  --fg:#f8f8f2;--fg2:#6272a4;--accent:#bd93f9;
  --green:#50fa7b;--orange:#ffb86c;--red:#ff5555;--blue:#8be9fd;--yellow:#f1fa8c;--pink:#ff79c6;--purple:#bd93f9;--grey:#6272a4;
  --link:#8be9fd;--link-hover:#bd93f9;
  --row-hover:rgba(68,71,90,.5);--row-selected:rgba(189,147,249,.12);
  --sev-error-bg:rgba(255,85,85,.15);--sev-error-fg:#ff5555;
  --sev-warn-bg:rgba(255,184,108,.15);--sev-warn-fg:#ffb86c;
  --sev-note-bg:rgba(139,233,253,.15);--sev-note-fg:#8be9fd;
  --toast-fg:#282a36;
  --overlay-bg:rgba(0,0,0,.6);
  --toggle-bg:var(--bg3);--toggle-fg:var(--fg);
}

/* ── Light theme ── */
[data-theme="light"]{
  --bg:#f8f8f2;--bg2:#eaeaf0;--bg3:#dcdce2;--bg4:#e8e8ee;
  --border:#bfc0cb;
  --fg:#282a36;--fg2:#6272a4;--accent:#7c3aed;
  --green:#16a34a;--orange:#d97706;--red:#dc2626;--blue:#0284c7;--yellow:#a16207;--pink:#db2777;--purple:#7c3aed;--grey:#6272a4;
  --link:#0284c7;--link-hover:#7c3aed;
  --row-hover:rgba(108,108,140,.08);--row-selected:rgba(124,58,237,.1);
  --sev-error-bg:rgba(220,38,38,.1);--sev-error-fg:#dc2626;
  --sev-warn-bg:rgba(217,119,6,.1);--sev-warn-fg:#d97706;
  --sev-note-bg:rgba(2,132,199,.1);--sev-note-fg:#0284c7;
  --toast-fg:#fff;
  --overlay-bg:rgba(0,0,0,.35);
  --toggle-bg:var(--bg3);--toggle-fg:var(--fg);
}

body{font-family:'Cascadia Code','Fira Code','Consolas','Courier New',monospace;background:var(--bg);color:var(--fg);display:flex;height:100vh;overflow:hidden;transition:background .3s,color .3s}

/* ── Sidebar ── */
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar h2{padding:16px;font-size:14px;color:var(--pink);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sidebar h2 span{font-size:18px}
.new-project-zone{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:6px}
.new-project-zone input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:6px 10px;border-radius:4px;font-family:inherit;font-size:12px}
.new-project-zone input:focus{outline:none;border-color:var(--purple)}
.upload-zone{padding:12px;border-top:1px solid var(--border)}
.upload-zone label{display:block;padding:10px;background:var(--bg3);border:1px dashed var(--grey);border-radius:6px;text-align:center;cursor:pointer;font-size:12px;color:var(--fg2);transition:.2s}
.upload-zone label:hover{border-color:var(--pink);color:var(--fg)}
.upload-zone input{display:none}
.project-list{flex:1;overflow-y:auto;padding:8px}
.project-item{padding:10px 12px;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;transition:.15s;color:var(--fg)}
.project-item:hover{background:var(--bg3)}
.project-item.active{background:var(--bg3);border-left:3px solid var(--purple)}
.project-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-item .count{color:var(--fg2);font-size:11px;margin-left:8px}
.project-item .proj-cb{flex-shrink:0;margin-right:8px;accent-color:var(--purple);cursor:pointer}
.project-item .del-btn{background:none;border:none;color:var(--fg2);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:3px;margin-left:6px;flex-shrink:0;z-index:1;position:relative}
.project-item .del-btn:hover{color:var(--red);background:rgba(255,85,85,.15)}
.bulk-delete-bar{display:none;padding:8px 12px;border-bottom:1px solid var(--border);align-items:center;gap:8px;font-size:12px;color:var(--fg2)}
.bulk-delete-bar.visible{display:flex}
.bulk-delete-bar button{background:var(--red);color:#fff;border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.bulk-delete-bar button:hover{opacity:.85}
.bulk-delete-bar .bulk-count{flex:1}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Stats bar ── */
.stats-bar{display:flex;gap:8px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.stat{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:bold;cursor:pointer;transition:.15s;border:1px solid transparent;user-select:none}
.stat:hover{opacity:.85}
.stat.active{border-color:var(--fg);box-shadow:0 0 0 1px var(--accent)}
.stat-sep{width:1px;height:24px;background:var(--border)}

/* ── Toolbar ── */
.toolbar{display:flex;gap:8px;padding:10px 16px;background:var(--bg4);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.toolbar input[type="text"]{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:6px 12px;border-radius:4px;font-family:inherit;font-size:12px;width:260px}
.toolbar input[type="text"]:focus{outline:none;border-color:var(--purple)}
.toolbar select{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:6px 8px;border-radius:4px;font-family:inherit;font-size:12px}
.toolbar .spacer{flex:1}
.toolbar .bulk-group{display:flex;gap:6px;align-items:center}
.toolbar .selection-count{font-size:11px;color:var(--fg2);white-space:nowrap}
.btn{padding:6px 14px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px;transition:.15s}
.btn:hover{border-color:var(--purple);color:var(--purple)}
.btn:disabled{opacity:.4;cursor:default}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-danger:disabled{opacity:.4;background:var(--bg3);color:var(--red)}

/* ── Table ── */
.table-wrap{flex:1;overflow:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{position:sticky;top:0;z-index:2}
th{background:var(--bg2);padding:10px 12px;text-align:left;font-weight:bold;color:var(--fg2);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:var(--row-hover)}
tr.selected td{background:var(--row-selected)}

.cb{width:16px;height:16px;accent-color:var(--purple);cursor:pointer}

/* ── Severity badge ── */
.sev{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;text-transform:uppercase}
.sev.error{background:var(--sev-error-bg);color:var(--sev-error-fg)}
.sev.warning{background:var(--sev-warn-bg);color:var(--sev-warn-fg)}
.sev.note,.sev.info{background:var(--sev-note-bg);color:var(--sev-note-fg)}

/* ── Status select ── */
.status-sel{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:4px 6px;border-radius:4px;font-family:inherit;font-size:11px;width:130px;cursor:pointer}
.status-sel:focus{outline:none;border-color:var(--purple)}

/* ── Notes ── */
.notes-input{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:4px 6px;border-radius:4px;font-family:inherit;font-size:11px;width:100%;min-width:120px;resize:none}
.notes-input:focus{outline:none;border-color:var(--purple)}

/* ── Links ── */
a{color:var(--link);text-decoration:none;transition:color .15s}
a:hover{color:var(--link-hover);text-decoration:underline}
a:visited{color:var(--link)}

/* ── File cell ── */
.file-cell{color:var(--green);font-size:11px;word-break:break-all}
.line-num{color:var(--fg2)}

/* ── Snippet ── */
.snippet{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2);font-size:11px}

/* ── Rule ── */
.rule-cell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Message ── */
.msg-cell{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help;color:var(--fg2);font-size:11px}

/* ── Empty state ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--fg2);gap:12px;font-size:14px}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:var(--toast-fg);padding:10px 20px;border-radius:6px;font-size:12px;font-family:inherit;opacity:0;transition:.3s;pointer-events:none;z-index:999;display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;pointer-events:auto}
.toast.err{background:var(--red)}
.toast .undo-btn{background:none;border:1px solid currentColor;color:inherit;padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:bold;white-space:nowrap}
.toast .undo-btn:hover{opacity:.8}

/* ── Graph button ── */
.graph-btn{background:none;border:1px solid var(--border);color:var(--fg2);cursor:pointer;padding:3px 8px;border-radius:4px;font-family:inherit;font-size:11px;transition:.15s;white-space:nowrap}
.graph-btn:hover{border-color:var(--purple);color:var(--purple)}

/* ── Confirm modal ── */
.confirm-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--overlay-bg);z-index:200;display:none;align-items:center;justify-content:center}
.confirm-overlay.open{display:flex}
.confirm-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:24px;min-width:300px;max-width:400px;text-align:center}
.confirm-box p{margin:0 0 16px;color:var(--fg);font-size:13px}
.confirm-box .confirm-actions{display:flex;gap:8px;justify-content:center}
.confirm-box button{padding:6px 16px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-size:12px;transition:.15s}
.confirm-box .confirm-yes{background:var(--red);color:#fff;border-color:var(--red)}
.confirm-box .confirm-yes:hover{opacity:.85}
.confirm-box .confirm-no{background:var(--bg3);color:var(--fg)}
.confirm-box .confirm-no:hover{background:var(--bg)}

/* ── Graph panel overlay ── */
.graph-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--overlay-bg);z-index:100;display:none;align-items:center;justify-content:center}
.graph-overlay.open{display:flex}
.graph-panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:92vw;max-width:1340px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.graph-panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}
.graph-panel-header h3{font-size:15px;color:var(--pink);font-weight:bold}
.graph-panel-close{background:none;border:none;color:var(--fg2);font-size:24px;cursor:pointer;padding:4px 10px;border-radius:4px}
.graph-panel-close:hover{color:var(--red);background:rgba(255,85,85,.15)}
.graph-panel-body{flex:1;overflow:auto;padding:24px;display:flex;align-items:flex-start;justify-content:center}
.graph-panel-body svg{max-width:100%;height:auto}
.graph-loading{color:var(--fg2);font-size:14px;padding:48px}

/* ── Theme toggle ── */
.theme-toggle{background:var(--bg3);border:1px solid var(--border);color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .2s;line-height:1;padding:0;flex-shrink:0}
.theme-toggle:hover{border-color:var(--purple);transform:scale(1.1)}

/* ── Drop overlay ── */
.drop-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:center;justify-content:center;pointer-events:none}
.drop-overlay.visible{display:flex}
.drop-overlay-box{border:3px dashed var(--purple);border-radius:16px;padding:48px 64px;background:var(--bg2);text-align:center;pointer-events:none}
.drop-overlay-box .drop-icon{font-size:48px;margin-bottom:12px;color:var(--purple)}
.drop-overlay-box .drop-text{font-size:16px;color:var(--fg);font-weight:bold}
.drop-overlay-box .drop-sub{font-size:12px;color:var(--fg2);margin-top:6px}

/* ── Scan modal ── */
.scan-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--overlay-bg);z-index:150;display:none;align-items:center;justify-content:center}
.scan-overlay.open{display:flex}
.scan-modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:460px;max-width:92vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.scan-modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.scan-modal-header h3{font-size:14px;color:var(--pink);font-weight:bold}
.scan-modal-close{background:none;border:none;color:var(--fg2);font-size:22px;cursor:pointer;padding:2px 8px;border-radius:4px}
.scan-modal-close:hover{color:var(--red);background:rgba(255,85,85,.15)}
.scan-modal-body{padding:20px;overflow-y:auto;flex:1;min-height:0}
.scan-modal-body label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px;margin-top:12px}
.scan-modal-body label:first-child{margin-top:0}
.scan-modal-body input,.scan-modal-body select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:8px 10px;border-radius:4px;font-family:inherit;font-size:12px}
.scan-modal-body input:focus,.scan-modal-body select:focus{outline:none;border-color:var(--purple)}
.scan-desc{margin-top:8px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--fg2);min-height:36px}
.settings-token-row{display:flex;gap:6px;align-items:center}
.settings-token-row input{flex:1}
.settings-token-clear{background:none;border:1px solid var(--border);color:var(--red);width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.settings-token-clear:hover{background:rgba(255,85,85,.15);border-color:var(--red)}
.scan-modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)}

/* ── Scan history ── */
.scan-history{padding:8px 12px;border-top:1px solid var(--border);max-height:180px;overflow-y:auto;display:none}
.scan-history.visible{display:block}
.scan-history-title{font-size:11px;color:var(--fg2);margin-bottom:6px;font-weight:bold}
.scan-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;font-size:11px;cursor:pointer;transition:.15s}
.scan-item:hover{background:var(--bg3)}
.scan-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.scan-dot.pending,.scan-dot.cloning,.scan-dot.running,.scan-dot.parsing{background:var(--orange);animation:pulse 1.2s infinite}
.scan-dot.completed{background:var(--green)}
.scan-dot.failed{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.scan-tool{font-weight:bold;color:var(--fg)}
.scan-status{color:var(--fg2);flex:1}
.scan-count{color:var(--fg2)}
.scan-delete{background:none;border:none;color:var(--fg2);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px;flex-shrink:0}
.scan-delete:hover{color:var(--red);background:rgba(255,85,85,.15)}

/* ── Scanner checkboxes ── */
.scanner-checkboxes{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.scanner-cb-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;cursor:pointer;transition:.15s;font-size:12px}
.scanner-cb-item:hover{background:var(--bg3)}
.scanner-cb-item input[type="checkbox"]{accent-color:var(--purple);cursor:pointer;width:15px;height:15px;flex-shrink:0}
.scanner-cb-name{font-weight:bold;color:var(--fg);white-space:nowrap}
.scanner-cb-desc{color:var(--fg2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scanner-cb-all{border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:2px}
.scanner-cb-all span{font-weight:bold;color:var(--accent)}

/* ── Custom rules ── */
.settings-divider{height:1px;background:var(--border);margin:16px 0 8px}
.rules-list{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.rule-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:12px}
.rule-item .rule-name{flex:1;color:var(--fg);font-weight:bold}
.rule-item .rule-date{color:var(--fg2);font-size:10px}
.rule-item .rule-del{background:none;border:none;color:var(--fg2);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:3px}
.rule-item .rule-del:hover{color:var(--red);background:rgba(255,85,85,.15)}
.rule-empty{color:var(--fg2);font-size:11px;font-style:italic;padding:4px 0}
.rule-import-label{display:block;padding:14px;background:var(--bg);border:1px dashed var(--border);border-radius:6px;text-align:center;cursor:pointer;font-size:12px;color:var(--fg2);transition:.2s;margin-top:4px}
.rule-import-label:hover{border-color:var(--purple);color:var(--fg)}
.rule-import-label.dragover{border-color:var(--purple);background:var(--bg3);color:var(--fg)}
.rule-import-status{font-size:11px;color:var(--fg2);margin-top:6px;min-height:16px}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
.pagination .page-info{font-size:12px;color:var(--fg2)}
.pagination .page-btn{padding:4px 12px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px;transition:.15s}
.pagination .page-btn:hover:not(:disabled){border-color:var(--purple);color:var(--purple)}
.pagination .page-btn:disabled{opacity:.3;cursor:default}
.pagination select{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:4px 6px;border-radius:4px;font-family:inherit;font-size:11px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--fg2)}
</style>
</head>
<body>

<div class="sidebar">
  <h2><span>&#9776;</span> Sarif2Web</h2>
  <div class="new-project-zone">
    <input type="text" id="new-project-name" placeholder="Project name..." maxlength="120">
    <button class="btn" id="create-project-btn">Create</button>
  </div>
  <div class="bulk-delete-bar" id="bulk-delete-bar">
    <span class="bulk-count" id="bulk-count">0 selected</span>
    <button id="bulk-delete-btn">Delete selected</button>
  </div>
  <div class="project-list" id="project-list"></div>
  <div class="upload-zone" id="upload-zone" style="display:none">
    <label id="upload-label">
      Drop or click to upload files
      <input type="file" id="file-input" accept=".sarif,.json" multiple>
    </label>
  </div>
  <div class="scan-history" id="scan-history"></div>
</div>

<div class="main">
  <div class="stats-bar" id="stats-bar"></div>
  <div class="toolbar" id="toolbar">
    <input type="text" id="search" placeholder="Search rule, file, message...">
    <div class="spacer"></div>
    <span class="selection-count" id="selection-count"></span>
    <div class="bulk-group">
      <select id="bulk-status">
        <option value="">Set status...</option>
        <option value="new">New</option>
        <option value="confirmed">Confirmed</option>
        <option value="false_positive">False Positive</option>
        <option value="mitigated">Mitigated</option>
        <option value="accepted_risk">Accepted Risk</option>
      </select>
      <button class="btn" id="bulk-apply" disabled>Apply</button>
      <button class="btn btn-danger" id="bulk-delete-findings" disabled>Delete</button>
    </div>
    <button class="btn" id="scan-btn" disabled>Scan</button>
    <button class="btn" id="export-btn" disabled>Export SARIF</button>
    <button class="theme-toggle" id="settings-btn" title="Settings">&#9881;</button>
    <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark theme">&#9790;</button>
  </div>
  <div class="table-wrap" id="table-wrap">
    <div class="empty" id="empty-state">
      <div>Upload a SARIF file to get started</div>
    </div>
  </div>
  <div id="pagination-bar"></div>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p id="confirm-msg">Are you sure?</p>
    <div class="confirm-actions">
      <button class="confirm-no" id="confirm-no">Cancel</button>
      <button class="confirm-yes" id="confirm-yes">Delete</button>
    </div>
  </div>
</div>

<div class="graph-overlay" id="graph-overlay">
  <div class="graph-panel">
    <div class="graph-panel-header">
      <h3 id="graph-title">Finding Graph</h3>
      <button class="graph-panel-close" id="graph-close">&times;</button>
    </div>
    <div class="graph-panel-body" id="graph-body">
      <span class="graph-loading">Loading...</span>
    </div>
  </div>
</div>

<div class="scan-overlay" id="scan-overlay">
  <div class="scan-modal">
    <div class="scan-modal-header">
      <h3>Launch Security Scan</h3>
      <button class="scan-modal-close" id="scan-modal-close">&times;</button>
    </div>
    <div class="scan-modal-body">
      <label>Repository URL</label>
      <input type="text" id="scan-repo-url" placeholder="https://github.com/user/repo.git">
      <label>Branch (optional)</label>
      <input type="text" id="scan-branch" placeholder="main">
      <label>Scanners</label>
      <div class="scanner-checkboxes" id="scanner-checkboxes"></div>
    </div>
    <div class="scan-modal-footer">
      <button class="btn" id="scan-cancel">Cancel</button>
      <button class="btn" id="scan-launch" style="border-color:var(--green);color:var(--green)">Launch Scan</button>
    </div>
  </div>
</div>

<div class="scan-overlay" id="settings-overlay">
  <div class="scan-modal">
    <div class="scan-modal-header">
      <h3>Settings</h3>
      <button class="scan-modal-close" id="settings-close">&times;</button>
    </div>
    <div class="scan-modal-body">
      <label>Semgrep Token <span style="color:var(--fg2);font-weight:normal">(enables semgrep ci with Cloud rules)</span></label>
      <div class="settings-token-row">
        <input type="password" id="settings-semgrep-token" placeholder="Not set" autocomplete="off">
        <button class="settings-token-clear" data-for="settings-semgrep-token" title="Remove token" style="display:none">&times;</button>
      </div>
      <label>Snyk Token <span style="color:var(--fg2);font-weight:normal">(required for Snyk scans)</span></label>
      <div class="settings-token-row">
        <input type="password" id="settings-snyk-token" placeholder="Not set" autocomplete="off">
        <button class="settings-token-clear" data-for="settings-snyk-token" title="Remove token" style="display:none">&times;</button>
      </div>
      <label>GitHub Token <span style="color:var(--fg2);font-weight:normal">(private repos)</span></label>
      <div class="settings-token-row">
        <input type="password" id="settings-github-token" placeholder="Not set" autocomplete="off">
        <button class="settings-token-clear" data-for="settings-github-token" title="Remove token" style="display:none">&times;</button>
      </div>
      <div class="settings-divider"></div>
      <label style="font-size:13px;color:var(--pink);font-weight:bold">Custom Semgrep Rules</label>
      <div class="rules-list" id="semgrep-rules-list"></div>
      <label>Import rules from YAML files</label>
      <label class="rule-import-label" id="rule-import-label">
        Click or drop .yml/.yaml files here
        <input type="file" id="rule-file-input" accept=".yml,.yaml" multiple style="display:none">
      </label>
      <div class="rule-import-status" id="rule-import-status"></div>
    </div>
    <div class="scan-modal-footer">
      <button class="btn" id="settings-cancel">Cancel</button>
      <button class="btn" id="settings-save" style="border-color:var(--green);color:var(--green)">Save</button>
    </div>
  </div>
</div>

<div class="drop-overlay" id="drop-overlay">
  <div class="drop-overlay-box">
    <div class="drop-icon">&#8615;</div>
    <div class="drop-text" id="drop-text">Drop files to upload</div>
    <div class="drop-sub" id="drop-sub">SARIF, TruffleHog or gitleaks JSON</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let currentProject = null;
let currentProjectName = null;
let findings = [];
let selected = new Set();
let activeFilters = { levels: new Set(), statuses: new Set(), tools: new Set() };
let searchTimeout = null;
let currentPage = 1;
let totalFindings = 0;
let perPage = 100;

const STATUS_LABELS = {
  new: 'New', confirmed: 'Confirmed',
  false_positive: 'False Positive', mitigated: 'Mitigated', accepted_risk: 'Accepted Risk'
};
function getStatusColors() {
  var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  return isDark ? {
    new: '#6272a4', confirmed: '#ff5555',
    false_positive: '#50fa7b', mitigated: '#8be9fd', accepted_risk: '#f1fa8c'
  } : {
    new: '#6272a4', confirmed: '#dc2626',
    false_positive: '#16a34a', mitigated: '#0284c7', accepted_risk: '#a16207'
  };
}

// -- Helpers --
function esc(s) {
  if (!s) return '';
  const d = document.createElement('span');
  d.textContent = s;
  return d.innerHTML;
}

var toastTimer = null;
function toast(msg, err, undoCallback) {
  const t = document.getElementById('toast');
  t.textContent = '';
  if (toastTimer) clearTimeout(toastTimer);
  var span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  if (undoCallback) {
    var btn = document.createElement('button');
    btn.className = 'undo-btn';
    btn.textContent = 'Undo';
    btn.addEventListener('click', function() {
      t.className = 'toast';
      undoCallback();
    });
    t.appendChild(btn);
  }
  t.className = 'toast show' + (err ? ' err' : '');
  toastTimer = setTimeout(function() { t.className = 'toast'; }, undoCallback ? 6000 : 2500);
}

// -- Create Project --
document.getElementById('create-project-btn').addEventListener('click', createProject);
document.getElementById('new-project-name').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') createProject();
});

async function createProject() {
  var nameInput = document.getElementById('new-project-name');
  var name = nameInput.value.trim();
  if (!name) { toast('Enter a project name', true); return; }
  try {
    var r = await fetch(API + '/api/projects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    });
    var d = await r.json();
    if (!r.ok) { toast(d.error || 'Failed to create project', true); return; }
    nameInput.value = '';
    toast('Project created');
    await loadProjects(d._id);
  } catch (ex) {
    toast('Network error', true);
  }
}

// -- Upload --
async function uploadFiles(files, projectId) {
  var ok = 0, fail = 0, total = 0, dupes = 0;
  for (var i = 0; i < files.length; i++) {
    var fd = new FormData();
    fd.append('file', files[i]);
    fd.append('project_id', projectId);
    try {
      var r = await fetch(API + '/api/upload', { method: 'POST', body: fd });
      var d = await r.json();
      if (r.ok) {
        ok++;
        total += d.count;
        dupes += d.duplicates_removed || 0;
      } else {
        fail++;
        toast(files[i].name + ': ' + (d.error || 'Upload failed'), true);
      }
    } catch (ex) {
      fail++;
      toast(files[i].name + ': Network error', true);
    }
  }
  if (ok > 0) {
    var msg = 'Loaded ' + total + ' findings from ' + ok + ' file' + (ok > 1 ? 's' : '');
    if (dupes > 0) msg += ' (' + dupes + ' duplicate' + (dupes > 1 ? 's' : '') + ' skipped)';
    toast(msg);
    await loadProjects(projectId);
    if (currentProject === projectId) await loadFindings(true);
  }
}

function setupFileInput() {
  document.getElementById('file-input').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    if (!files.length || !currentProject) return;
    const label = document.getElementById('upload-label');
    label.textContent = 'Uploading ' + files.length + ' file' + (files.length > 1 ? 's' : '') + '...';
    await uploadFiles(files, currentProject);
    resetUploadZone();
  });
}

function resetUploadZone() {
  var zone = document.getElementById('upload-zone');
  zone.textContent = '';
  var newLabel = document.createElement('label');
  newLabel.id = 'upload-label';
  newLabel.textContent = currentProjectName ? 'Upload files to ' + currentProjectName : 'Drop or click to upload files';
  var newInput = document.createElement('input');
  newInput.type = 'file';
  newInput.id = 'file-input';
  newInput.accept = '.sarif,.json';
  newInput.multiple = true;
  newLabel.appendChild(newInput);
  zone.appendChild(newLabel);
  setupFileInput();
}

setupFileInput();

// -- Global drag & drop --
(function() {
  var dragCounter = 0;
  var overlay = document.getElementById('drop-overlay');
  var dropText = document.getElementById('drop-text');
  var dropSub = document.getElementById('drop-sub');

  function updateDropText() {
    if (currentProject) {
      dropText.textContent = 'Drop files to upload to ' + (currentProjectName || 'project');
      dropSub.textContent = 'SARIF, TruffleHog or gitleaks JSON';
    } else {
      dropText.textContent = 'Drop files to create a new project';
      dropSub.textContent = 'A project will be created automatically from the filename';
    }
  }

  document.addEventListener('dragenter', function(e) {
    e.preventDefault();
    dragCounter++;
    if (dragCounter === 1) {
      updateDropText();
      overlay.classList.add('visible');
    }
  });

  document.addEventListener('dragleave', function(e) {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      overlay.classList.remove('visible');
    }
  });

  document.addEventListener('dragover', function(e) {
    e.preventDefault();
  });

  document.addEventListener('drop', async function(e) {
    e.preventDefault();
    dragCounter = 0;
    overlay.classList.remove('visible');

    var files = Array.from(e.dataTransfer.files).filter(function(f) {
      var name = f.name.toLowerCase();
      return name.endsWith('.sarif') || name.endsWith('.json');
    });
    if (!files.length) {
      toast('No .sarif or .json files found', true);
      return;
    }

    var projectId = currentProject;

    // If no project selected, auto-create one from the first filename
    if (!projectId) {
      var autoName = files[0].name.replace(/\.(sarif|json)$/i, '');
      if (files.length > 1) autoName += ' (+' + (files.length - 1) + ' files)';
      try {
        var r = await fetch(API + '/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: autoName })
        });
        var d = await r.json();
        if (!r.ok) { toast(d.error || 'Failed to create project', true); return; }
        projectId = d._id;
        await loadProjects(projectId);
        await selectProject(projectId);
      } catch (ex) {
        toast('Network error', true);
        return;
      }
    }

    await uploadFiles(files, projectId);
  });
})();

// -- Projects --
var selectedProjects = new Set();
var lastCheckedIndex = -1;

function updateBulkBar() {
  var bar = document.getElementById('bulk-delete-bar');
  var count = selectedProjects.size;
  if (count > 0) {
    bar.classList.add('visible');
    document.getElementById('bulk-count').textContent = count + ' selected';
  } else {
    bar.classList.remove('visible');
  }
}

document.getElementById('bulk-delete-btn').addEventListener('click', async function() {
  if (!selectedProjects.size) return;
  var confirmed = await showConfirm('Delete ' + selectedProjects.size + ' project' + (selectedProjects.size > 1 ? 's' : '') + ' and all their findings?');
  if (!confirmed) return;
  try {
    var r = await fetch(API + '/api/projects/bulk-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: Array.from(selectedProjects) })
    });
    if (!r.ok) {
      var data = await r.json().catch(function() { return {}; });
      toast(data.error || 'Bulk delete failed', true);
      return;
    }
    var data = await r.json();
    if (selectedProjects.has(currentProject)) {
      currentProject = null;
      currentProjectName = null;
      findings = [];
      document.getElementById('upload-zone').style.display = 'none';
      document.getElementById('scan-history').classList.remove('visible');
      document.getElementById('scan-btn').disabled = true;
      renderTable();
      renderStats();
    }
    toast(data.deleted + ' project' + (data.deleted > 1 ? 's' : '') + ' deleted');
    selectedProjects.clear();
    updateBulkBar();
    await loadProjects();
  } catch (err) {
    toast('Network error: ' + err.message, true);
  }
});

async function loadProjects(selectId) {
  const r = await fetch(API + '/api/projects');
  const projects = await r.json();
  const list = document.getElementById('project-list');
  list.textContent = '';

  // Clean up selectedProjects that no longer exist
  var existingIds = new Set(projects.map(function(p) { return p._id; }));
  selectedProjects.forEach(function(id) {
    if (!existingIds.has(id)) selectedProjects.delete(id);
  });
  updateBulkBar();

  projects.forEach(function(p, idx) {
    const div = document.createElement('div');
    div.className = 'project-item' + (currentProject === p._id || selectId === p._id ? ' active' : '');
    div.dataset.idx = idx;

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'proj-cb';
    cb.checked = selectedProjects.has(p._id);
    cb.addEventListener('click', function(e) {
      e.stopPropagation();
      if (e.shiftKey && lastCheckedIndex >= 0 && lastCheckedIndex !== idx) {
        var from = Math.min(lastCheckedIndex, idx);
        var to = Math.max(lastCheckedIndex, idx);
        var items = list.querySelectorAll('.project-item');
        for (var i = from; i <= to; i++) {
          var itemCb = items[i].querySelector('.proj-cb');
          var itemId = items[i].dataset.projectId;
          itemCb.checked = cb.checked;
          if (cb.checked) selectedProjects.add(itemId);
          else selectedProjects.delete(itemId);
        }
      } else {
        if (cb.checked) selectedProjects.add(p._id);
        else selectedProjects.delete(p._id);
      }
      lastCheckedIndex = idx;
      updateBulkBar();
    });

    div.dataset.projectId = p._id;

    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.title = p.name;
    nameSpan.textContent = p.name;

    const countSpan = document.createElement('span');
    countSpan.className = 'count';
    countSpan.textContent = p.finding_count;

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.title = 'Delete';
    delBtn.textContent = '\u2715';
    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      deleteProject(p._id);
    });

    div.appendChild(cb);
    div.appendChild(nameSpan);
    div.appendChild(countSpan);
    div.appendChild(delBtn);
    div.addEventListener('click', function() { selectProject(p._id); });
    list.appendChild(div);
  });

  if (selectId) selectProject(selectId);
}

function showConfirm(msg) {
  return new Promise(function(resolve) {
    var overlay = document.getElementById('confirm-overlay');
    document.getElementById('confirm-msg').textContent = msg;
    overlay.classList.add('open');
    function cleanup(result) {
      overlay.classList.remove('open');
      document.getElementById('confirm-yes').removeEventListener('click', onYes);
      document.getElementById('confirm-no').removeEventListener('click', onNo);
      overlay.removeEventListener('click', onBg);
      resolve(result);
    }
    function onYes() { cleanup(true); }
    function onNo() { cleanup(false); }
    function onBg(e) { if (e.target === overlay) cleanup(false); }
    document.getElementById('confirm-yes').addEventListener('click', onYes);
    document.getElementById('confirm-no').addEventListener('click', onNo);
    overlay.addEventListener('click', onBg);
  });
}

async function deleteProject(id) {
  var confirmed = await showConfirm('Delete this project and all its findings?');
  if (!confirmed) return;
  try {
    const r = await fetch(API + '/api/projects/' + id, { method: 'DELETE' });
    if (!r.ok) {
      const data = await r.json().catch(function() { return {}; });
      toast(data.error || 'Failed to delete project', true);
      return;
    }
    if (currentProject === id) {
      currentProject = null;
      currentProjectName = null;
      findings = [];
      document.getElementById('upload-zone').style.display = 'none';
      document.getElementById('scan-history').classList.remove('visible');
      document.getElementById('scan-btn').disabled = true;
      renderTable();
      renderStats();
    }
    await loadProjects();
    toast('Project deleted');
  } catch (err) {
    toast('Network error: ' + err.message, true);
  }
}

async function selectProject(id) {
  currentProject = id;
  selected.clear();
  // Find the project name from the sidebar
  var item = document.querySelector('.project-item[data-project-id="' + id + '"]');
  currentProjectName = item ? item.querySelector('.name').textContent : '';
  // Show upload zone
  var uploadZone = document.getElementById('upload-zone');
  uploadZone.style.display = '';
  resetUploadZone();
  // Mark active
  document.querySelectorAll('.project-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.projectId === id);
  });
  document.getElementById('export-btn').disabled = false;
  document.getElementById('scan-btn').disabled = false;
  await loadFindings(true);
  pollScans();
}

// -- Findings --
let globalCounts = { levels: {}, statuses: {}, total: 0 };

async function loadCounts() {
  if (!currentProject) return;
  const r = await fetch(API + '/api/findings/counts?project_id=' + currentProject);
  globalCounts = await r.json();
}

async function loadFindings(resetPage) {
  if (!currentProject) return;
  if (resetPage) currentPage = 1;
  const params = new URLSearchParams({ project_id: currentProject, page: currentPage, per_page: perPage });

  const q = document.getElementById('search').value.trim();
  if (q) params.set('q', q);
  if (activeFilters.levels.size) params.set('level', Array.from(activeFilters.levels).join(','));
  if (activeFilters.statuses.size) params.set('status', Array.from(activeFilters.statuses).join(','));
  if (activeFilters.tools.size) params.set('tool', Array.from(activeFilters.tools).join(','));

  await loadCounts();
  const r = await fetch(API + '/api/findings?' + params);
  const data = await r.json();
  findings = data.findings;
  totalFindings = data.total;
  selected.clear();
  renderStats();
  renderTable();
}

// -- Stats --
function renderStats() {
  const bar = document.getElementById('stats-bar');
  bar.textContent = '';
  if (!currentProject) return;

  // Use global (unfiltered) counts so all badges are always visible
  const levelCounts = globalCounts.levels || {};
  const statusCounts = globalCounts.statuses || {};
  const toolCounts = globalCounts.tools || {};

  function addLabel(text) {
    const s = document.createElement('span');
    s.style.cssText = 'font-size:11px;color:var(--fg2);margin-right:4px';
    s.textContent = text;
    bar.appendChild(s);
  }

  function addStat(type, label, count, filterGroup) {
    const s = document.createElement('span');
    var isActive = activeFilters[filterGroup].has(type);
    s.className = 'stat' + (isActive ? ' active' : '');
    s.setAttribute('data-type', type);
    s.textContent = label + ' ' + count;
    var sc = getStatusColors();
    const colors = {
      error: 'var(--sev-error-bg)', warning: 'var(--sev-warn-bg)',
      note: 'var(--sev-note-bg)', info: 'var(--sev-note-bg)',
      new: 'rgba(98,114,164,.2)', confirmed: 'var(--sev-error-bg)',
      false_positive: 'rgba(80,250,123,.15)',
      mitigated: 'rgba(139,233,253,.15)', accepted_risk: 'rgba(241,250,140,.15)'
    };
    const fgColors = {
      error: sc.confirmed, warning: 'var(--orange)', note: 'var(--blue)', info: 'var(--blue)',
      new: sc.new, confirmed: sc.confirmed,
      false_positive: sc.false_positive, mitigated: sc.mitigated, accepted_risk: sc.accepted_risk
    };
    s.style.background = colors[type] || (filterGroup === 'tools' ? 'rgba(189,147,249,.15)' : 'rgba(127,140,141,.2)');
    s.style.color = fgColors[type] || (filterGroup === 'tools' ? 'var(--purple)' : '#7f8c8d');
    s.addEventListener('click', function() { toggleFilter(filterGroup, type); });
    bar.appendChild(s);
  }

  addLabel('Severity:');
  ['error','warning','note','info'].forEach(function(l) {
    if (levelCounts[l]) addStat(l, l, levelCounts[l], 'levels');
  });

  const sep = document.createElement('span');
  sep.className = 'stat-sep';
  bar.appendChild(sep);

  addLabel('Status:');
  Object.keys(STATUS_LABELS).forEach(function(s) {
    if (statusCounts[s]) addStat(s, STATUS_LABELS[s], statusCounts[s], 'statuses');
  });

  var toolKeys = Object.keys(toolCounts).sort();
  if (toolKeys.length) {
    const sep2 = document.createElement('span');
    sep2.className = 'stat-sep';
    bar.appendChild(sep2);

    addLabel('Tool:');
    toolKeys.forEach(function(t) {
      addStat(t, t, toolCounts[t], 'tools');
    });
  }

  const sepTotal = document.createElement('span');
  sepTotal.className = 'stat-sep';
  bar.appendChild(sepTotal);

  const total = document.createElement('span');
  total.style.cssText = 'font-size:11px;color:var(--fg2)';
  var filteredText = totalFindings < globalCounts.total ? totalFindings + ' / ' + globalCounts.total : '' + globalCounts.total;
  total.textContent = 'Total: ' + filteredText;
  bar.appendChild(total);
}

function toggleFilter(type, val) {
  if (activeFilters[type].has(val)) activeFilters[type].delete(val);
  else activeFilters[type].add(val);
  loadFindings(true);
}

// -- Table --
function renderTable() {
  const wrap = document.getElementById('table-wrap');
  wrap.textContent = '';
  var pagBar = document.getElementById('pagination-bar');
  pagBar.textContent = '';
  pagBar.className = '';

  if (!currentProject) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Create a project and upload files to get started';
    wrap.appendChild(empty);
    return;
  }

  if (!findings.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No findings match filters';
    wrap.appendChild(empty);
    return;
  }

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');

  // Select all checkbox
  const thCb = document.createElement('th');
  const selectAllCb = document.createElement('input');
  selectAllCb.type = 'checkbox';
  selectAllCb.className = 'cb';
  selectAllCb.addEventListener('change', function() { toggleAll(this.checked); });
  thCb.appendChild(selectAllCb);
  headerRow.appendChild(thCb);

  ['Severity','Rule','File','Snippet','Tool','CWE','Status','Notes',''].forEach(function(h) {
    const th = document.createElement('th');
    th.textContent = h;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  findings.forEach(function(f, idx) {
    const tr = document.createElement('tr');
    tr.setAttribute('data-id', f._id);
    if (selected.has(f._id)) tr.classList.add('selected');

    // Checkbox
    const tdCb = document.createElement('td');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'cb';
    cb.checked = selected.has(f._id);
    cb.addEventListener('click', function(e) { toggleSelect(f._id, this.checked, idx, e.shiftKey); });
    tdCb.appendChild(cb);
    tr.appendChild(tdCb);

    // Severity
    const tdSev = document.createElement('td');
    const sevSpan = document.createElement('span');
    sevSpan.className = 'sev ' + f.level;
    sevSpan.textContent = f.level;
    tdSev.appendChild(sevSpan);
    tr.appendChild(tdSev);

    // Rule
    const tdRule = document.createElement('td');
    tdRule.className = 'rule-cell';
    if (f.help_uri) {
      const a = document.createElement('a');
      a.href = f.help_uri;
      a.target = '_blank';
      a.title = f.rule_id;
      a.textContent = f.rule_id;
      tdRule.appendChild(a);
    } else {
      tdRule.textContent = f.rule_id;
    }
    tr.appendChild(tdRule);

    // File
    const tdFile = document.createElement('td');
    tdFile.className = 'file-cell';
    tdFile.textContent = f.file;
    const lineSpan = document.createElement('span');
    lineSpan.className = 'line-num';
    lineSpan.textContent = ':' + f.start_line;
    tdFile.appendChild(lineSpan);
    tr.appendChild(tdFile);

    // Snippet
    const tdSnip = document.createElement('td');
    tdSnip.className = 'snippet';
    tdSnip.title = f.message || '';
    tdSnip.textContent = f.snippet || (f.message ? f.message.substring(0, 80) : '');
    tr.appendChild(tdSnip);

    // Tool
    const tdTool = document.createElement('td');
    var toolName = f.source_tool || '';
    var toolSpan = document.createElement('span');
    toolSpan.textContent = toolName;
    toolSpan.style.cssText = 'font-size:11px;cursor:pointer;padding:2px 8px;border-radius:10px;' +
      (activeFilters.tools.has(toolName)
        ? 'background:rgba(189,147,249,.25);color:var(--purple);font-weight:bold'
        : 'color:var(--fg2)');
    toolSpan.title = 'Filter by ' + toolName;
    if (toolName) {
      toolSpan.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleFilter('tools', toolName);
      });
    }
    tdTool.appendChild(toolSpan);
    tr.appendChild(tdTool);

    // CWE
    const tdCwe = document.createElement('td');
    tdCwe.style.cssText = 'font-size:11px;color:var(--fg2)';
    const cwes = (f.cwes || []).map(function(c) { var m = c.match(/CWE-\d+/); return m ? m[0] : c; });
    tdCwe.textContent = cwes.join(', ');
    tr.appendChild(tdCwe);

    // Status
    const tdStatus = document.createElement('td');
    const sel = document.createElement('select');
    sel.className = 'status-sel';
    sel.style.color = getStatusColors()[f.status] || '#7f8c8d';
    Object.keys(STATUS_LABELS).forEach(function(k) {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = STATUS_LABELS[k];
      if (f.status === k) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function() { updateStatus(f._id, this.value, this); });
    tdStatus.appendChild(sel);
    tr.appendChild(tdStatus);

    // Notes
    const tdNotes = document.createElement('td');
    const textarea = document.createElement('textarea');
    textarea.className = 'notes-input';
    textarea.rows = 1;
    textarea.placeholder = '...';
    textarea.value = f.notes || '';
    textarea.addEventListener('change', function() { updateNotes(f._id, this.value); });
    tdNotes.appendChild(textarea);
    tr.appendChild(tdNotes);

    // Graph button
    var tdGraph = document.createElement('td');
    var graphBtn = document.createElement('button');
    graphBtn.className = 'graph-btn';
    graphBtn.textContent = 'Graph';
    graphBtn.addEventListener('click', function() { openGraph(f._id, f.rule_id); });
    tdGraph.appendChild(graphBtn);
    tr.appendChild(tdGraph);

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  renderPagination();
  updateBulkBtn();
}

function renderPagination() {
  var pag = document.getElementById('pagination-bar');
  pag.textContent = '';
  var totalPages = Math.ceil(totalFindings / perPage);
  if (totalPages <= 1) return;
  pag.className = 'pagination';

    var prevBtn = document.createElement('button');
    prevBtn.className = 'page-btn';
    prevBtn.textContent = '\u2190 Prev';
    prevBtn.disabled = currentPage <= 1;
    prevBtn.addEventListener('click', function() { currentPage--; loadFindings(); });
    pag.appendChild(prevBtn);

    var start = (currentPage - 1) * perPage + 1;
    var end = Math.min(currentPage * perPage, totalFindings);
    var info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = start + '-' + end + ' of ' + totalFindings + '  (page ' + currentPage + '/' + totalPages + ')';
    pag.appendChild(info);

    var nextBtn = document.createElement('button');
    nextBtn.className = 'page-btn';
    nextBtn.textContent = 'Next \u2192';
    nextBtn.disabled = currentPage >= totalPages;
    nextBtn.addEventListener('click', function() { currentPage++; loadFindings(); });
    pag.appendChild(nextBtn);

    var ppSel = document.createElement('select');
    ppSel.title = 'Results per page';
    [50, 100, 200, 500].forEach(function(n) {
      var opt = document.createElement('option');
      opt.value = n;
      opt.textContent = n + '/page';
      if (n === perPage) opt.selected = true;
      ppSel.appendChild(opt);
    });
    ppSel.addEventListener('change', function() { perPage = parseInt(this.value); loadFindings(true); });
    pag.appendChild(ppSel);
}

// -- Selection --
var lastCheckedFindingIndex = -1;

function toggleSelect(id, checked, index, shiftKey) {
  if (shiftKey && lastCheckedFindingIndex >= 0 && lastCheckedFindingIndex !== index) {
    var from = Math.min(lastCheckedFindingIndex, index);
    var to = Math.max(lastCheckedFindingIndex, index);
    var rows = document.querySelectorAll('tbody tr');
    for (var i = from; i <= to; i++) {
      var fid = findings[i]._id;
      if (checked) selected.add(fid); else selected.delete(fid);
      if (rows[i]) {
        rows[i].classList.toggle('selected', checked);
        var cb = rows[i].querySelector('.cb');
        if (cb) cb.checked = checked;
      }
    }
  } else {
    if (checked) selected.add(id); else selected.delete(id);
    var row = document.querySelector('tr[data-id="' + id + '"]');
    if (row) row.classList.toggle('selected', checked);
  }
  lastCheckedFindingIndex = index;
  updateBulkBtn();
}

function toggleAll(checked) {
  findings.forEach(function(f) {
    if (checked) selected.add(f._id); else selected.delete(f._id);
  });
  document.querySelectorAll('tbody .cb').forEach(function(cb) { cb.checked = checked; });
  document.querySelectorAll('tbody tr').forEach(function(tr) { tr.classList.toggle('selected', checked); });
  updateBulkBtn();
}

function updateBulkBtn() {
  var has = selected.size > 0;
  document.getElementById('bulk-apply').disabled = !has;
  document.getElementById('bulk-delete-findings').disabled = !has;
  document.getElementById('selection-count').textContent = has ? selected.size + ' selected' : '';
}

// -- Graph panel --
async function openGraph(findingId, ruleId) {
  var overlay = document.getElementById('graph-overlay');
  var body = document.getElementById('graph-body');
  var title = document.getElementById('graph-title');
  title.textContent = ruleId || 'Finding Graph';
  body.textContent = '';
  var loading = document.createElement('span');
  loading.className = 'graph-loading';
  loading.textContent = 'Loading graph...';
  body.appendChild(loading);
  overlay.classList.add('open');

  try {
    var theme = document.documentElement.getAttribute('data-theme') || 'dark';
    var r = await fetch(API + '/api/findings/' + findingId + '/svg?theme=' + theme);
    if (!r.ok) throw new Error('Failed to load');
    var svgText = await r.text();
    body.textContent = '';
    // Parse SVG safely via DOMParser
    var parser = new DOMParser();
    var doc = parser.parseFromString(svgText, 'image/svg+xml');
    var svgEl = doc.documentElement;
    if (svgEl && svgEl.tagName === 'svg') {
      body.appendChild(document.importNode(svgEl, true));
    } else {
      var err = document.createElement('span');
      err.className = 'graph-loading';
      err.textContent = 'Failed to parse SVG';
      body.appendChild(err);
    }
  } catch (ex) {
    body.textContent = '';
    var err = document.createElement('span');
    err.className = 'graph-loading';
    err.textContent = 'Error loading graph';
    body.appendChild(err);
  }
}

// -- Custom Semgrep Rules --
async function loadSemgrepRules() {
  var list = document.getElementById('semgrep-rules-list');
  list.textContent = '';
  try {
    var r = await fetch(API + '/api/semgrep-rules');
    var rules = await r.json();
    if (!rules.length) {
      var empty = document.createElement('div');
      empty.className = 'rule-empty';
      empty.textContent = 'No custom rules configured';
      list.appendChild(empty);
      return;
    }
    rules.forEach(function(rule) {
      var div = document.createElement('div');
      div.className = 'rule-item';
      var name = document.createElement('span');
      name.className = 'rule-name';
      name.textContent = rule.name;
      name.title = rule.content;
      var del = document.createElement('button');
      del.className = 'rule-del';
      del.title = 'Delete rule';
      del.textContent = '\u2715';
      del.addEventListener('click', async function() {

        loadSemgrepRules();
      });

async function uploadRuleFiles(files) {
  var status = document.getElementById('rule-import-status');
  var ok = 0, fail = 0;
  status.textContent = 'Importing ' + files.length + ' file' + (files.length > 1 ? 's' : '') + '...';
  for (var i = 0; i < files.length; i++) {
    var file = files[i];
    var name = file.name.replace(/\.(ya?ml)$/i, '');
    try {
      var content = await file.text();
      var r = await fetch(API + '/api/semgrep-rules', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, content: content })
      });
      var d = await r.json();
      if (r.ok) { ok++; } else { fail++; toast(file.name + ': ' + (d.error || 'failed'), true); }
    } catch (ex) { fail++; toast(file.name + ': network error', true); }
  }
  if (ok > 0) {
    toast(ok + ' rule' + (ok > 1 ? 's' : '') + ' imported');
    loadSemgrepRules();
  }
  status.textContent = ok > 0 ? ok + ' imported' + (fail > 0 ? ', ' + fail + ' failed' : '') : '';
  setTimeout(function() { status.textContent = ''; }, 3000);
}

document.getElementById('rule-file-input').addEventListener('change', function(e) {
  var files = Array.from(e.target.files).filter(function(f) {
    return /\.ya?ml$/i.test(f.name);
  });
  if (files.length) uploadRuleFiles(files);
  e.target.value = '';
});

(function() {
  var label = document.getElementById('rule-import-label');
  label.addEventListener('dragover', function(e) { e.preventDefault(); label.classList.add('dragover'); });
  label.addEventListener('dragleave', function() { label.classList.remove('dragover'); });
  label.addEventListener('drop', function(e) {
    e.preventDefault();
    e.stopPropagation();
    label.classList.remove('dragover');
    var files = Array.from(e.dataTransfer.files).filter(function(f) {
      return /\.ya?ml$/i.test(f.name);
    });
    if (!files.length) { toast('No .yml/.yaml files found', true); return; }
    uploadRuleFiles(files);
  });
})();

// -- Scan history & polling --
var scanPollTimer = null;

async function pollScans() {
  if (!currentProject) return;
  try {
    var r = await fetch(API + '/api/scans?project_id=' + currentProject);
    var scans = await r.json();
    renderScans(scans);
    var hasActive = scans.some(function(s) {
      return ['pending','cloning','running','parsing'].includes(s.status);
    });
    if (hasActive) {
      if (scanPollTimer) clearTimeout(scanPollTimer);
      scanPollTimer = setTimeout(pollScans, 3000);
    } else {
      // Check if a scan just finished — reload findings
      if (scanPollTimer) {
        clearTimeout(scanPollTimer);
        scanPollTimer = null;
        await loadFindings();
        await loadProjects(currentProject);
      }
    }
  } catch (ex) {}
}

function renderScans(scans) {
  var container = document.getElementById('scan-history');
  container.textContent = '';
  if (!scans.length) {
    container.classList.remove('visible');
    return;
  }
  container.classList.add('visible');

  var title = document.createElement('div');
  title.className = 'scan-history-title';
  title.textContent = 'Recent Scans';
  container.appendChild(title);

  scans.forEach(function(s) {
    var div = document.createElement('div');
    div.className = 'scan-item';

    var dot = document.createElement('span');
    dot.className = 'scan-dot ' + s.status;
    div.appendChild(dot);

    var toolSpan = document.createElement('span');
    toolSpan.className = 'scan-tool';
    toolSpan.textContent = s.tool;
    div.appendChild(toolSpan);

    var statusSpan = document.createElement('span');
    statusSpan.className = 'scan-status';
    if (s.status === 'completed') {
      statusSpan.textContent = 'completed';
    } else if (s.status === 'failed') {
      statusSpan.textContent = 'failed';
    } else {
      statusSpan.textContent = s.status + '...';
    }
    div.appendChild(statusSpan);

    if (s.status === 'completed' && s.findings_count !== undefined) {
      var countSpan = document.createElement('span');
      countSpan.className = 'scan-count';
      countSpan.textContent = s.findings_count + ' finds';
      if (s.duplicates_count > 0) countSpan.textContent += ' (' + s.duplicates_count + ' dupes)';
      div.appendChild(countSpan);
    }

    var delBtn = document.createElement('button');
    delBtn.className = 'scan-delete';
    delBtn.title = 'Remove from history';
    delBtn.textContent = '\u2715';
    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      deleteScan(s._id);
    });
    div.appendChild(delBtn);

    div.addEventListener('click', function() {
      if (s.status === 'failed') {
        toast(s.error || 'Scan failed (no details)', true);
      } else if (s.status === 'completed') {
        loadFindings();
      }
    });

    container.appendChild(div);
  });
}

async function deleteScan(id) {
  try {
    await fetch(API + '/api/scans/' + id, { method: 'DELETE' });
    pollScans();
  } catch (ex) {
    toast('Network error', true);
  }
}
