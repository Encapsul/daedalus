[app]
name = "sarif2web"
isolation = 0

[[services]]
name = "mongo"
cmd = ["/usr/local/bin/mongod", "--dbpath", "/data/db", "--port", "27017", "--bind_ip", "127.0.0.1"]
ready_port = 27017
ready_timeout = 30

[[services]]
name = "flask"
cmd = ["/usr/bin/python3", "/app/app.py"]
env = { MONGO_URI = "mongodb://127.0.0.1:27017/sarif_manager", PYTHONUNBUFFERED = "1", PYTHONDONTWRITEBYTECODE = "1", FLASK_DEBUG = "0" }
ready_port = 5000
ready_timeout = 15

[[services]]
name = "nginx"
cmd = ["/usr/sbin/nginx", "-g", "daemon off;"]
ready_port = 80
ready_timeout = 10
