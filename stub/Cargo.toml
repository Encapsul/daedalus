[package]
name = "xbin-stub"
version = "0.1.0"
edition = "2021"
description = "xbin launcher stub — self-extracting ELF that runs the embedded app"

[[bin]]
name = "xbin-stub"
path = "src/main.rs"

[dependencies]
# Pure-Rust deps only: lets us build a fully static musl binary without a C toolchain.
ruzstd = "0.7"          # zstd decompression (decode-only, pure Rust)
tar = "0.4"             # tar extraction
sha2 = "0.10"           # SHA-256 integrity check
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization
codegen-units = 1   # better LTO
strip = true        # drop debug symbols
panic = "abort"     # no unwinding machinery
