name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────
  build-linux-x64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build stub
        run: cargo build --release --target x86_64-unknown-linux-musl -p xbin-stub

      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Test binaries
        run: |
          STUB=target/x86_64-unknown-linux-musl/release/xbin-stub
          CLI=target/release/xbin
          file "$STUB" | grep -q "ELF" || { echo "FAIL: stub not ELF"; exit 1; }
          file "$CLI" | grep -q "ELF" || { echo "FAIL: cli not ELF"; exit 1; }
          echo "=== PASS: linux-x64 ==="

      - name: Package
        run: |
          STUB=target/x86_64-unknown-linux-musl/release/xbin-stub
          CLI=target/release/xbin
          CRYPTO=target/x86_64-unknown-linux-musl/release/xbin-crypto
          DIR="xbin-linux-x64"
          mkdir -p "${DIR}/bin"
          cp "$STUB" "${DIR}/bin/"
          cp "$CLI" "${DIR}/bin/"
          [ -f "$CRYPTO" ] && cp "$CRYPTO" "${DIR}/bin/" || true
          chmod +x "${DIR}/bin/"*
          tar czf "/tmp/assets/${DIR}.tar.gz" "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux-x64
          path: /tmp/assets/*

  # ── Linux aarch64 ────────────────────────────────────────────────────
  build-linux-arm64:
    name: Linux (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Build stub
        run: cargo build --release --target aarch64-unknown-linux-musl -p xbin-stub
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Test binaries
        run: |
          STUB=target/aarch64-unknown-linux-musl/release/xbin-stub
          CLI=target/release/xbin
          file "$STUB" | grep -q "ELF" || { echo "FAIL: stub not ELF"; exit 1; }
          file "$STUB" | grep -q "aarch64" || { echo "FAIL: stub not aarch64"; exit 1; }
          echo "=== PASS: linux-arm64 ==="

      - name: Package
        run: |
          STUB=target/aarch64-unknown-linux-musl/release/xbin-stub
          CLI=target/release/xbin
          CRYPTO=target/aarch64-unknown-linux-musl/release/xbin-crypto
          DIR="xbin-linux-arm64"
          mkdir -p "${DIR}/bin"
          cp "$STUB" "${DIR}/bin/"
          cp "$CLI" "${DIR}/bin/"
          [ -f "$CRYPTO" ] && cp "$CRYPTO" "${DIR}/bin/" || true
          chmod +x "${DIR}/bin/"*
          tar czf "/tmp/assets/${DIR}.tar.gz" "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux-arm64
          path: /tmp/assets/*

  # ── macOS Apple Silicon ──────────────────────────────────────────────
  build-macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build stub
        run: cargo build --release -p xbin-stub

      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Test binaries
        run: |
          STUB=target/release/xbin-stub
          CLI=target/release/xbin
          file "$STUB" | grep -q "Mach-O" || { echo "FAIL: stub not Mach-O"; exit 1; }
          file "$CLI" | grep -q "Mach-O" || { echo "FAIL: cli not Mach-O"; exit 1; }
          echo "=== PASS: macos-arm64 ==="

      - name: Package
        run: |
          STUB=target/release/xbin-stub
          CLI=target/release/xbin
          CRYPTO=target/release/xbin-crypto
          DIR="xbin-macos-arm64"
          mkdir -p "${DIR}/bin"
          cp "$STUB" "${DIR}/bin/"
          cp "$CLI" "${DIR}/bin/"
          [ -f "$CRYPTO" ] && cp "$CRYPTO" "${DIR}/bin/" || true
          chmod +x "${DIR}/bin/"*
          tar czf "/tmp/assets/${DIR}.tar.gz" "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-macos-arm64
          path: /tmp/assets/*

  # ── macOS Intel ──────────────────────────────────────────────────────
  build-macos-x64:
    name: macOS (Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build stub
        run: cargo build --release -p xbin-stub

      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Test binaries
        run: |
          STUB=target/release/xbin-stub
          CLI=target/release/xbin
          file "$STUB" | grep -q "Mach-O" || { echo "FAIL: stub not Mach-O"; exit 1; }
          file "$CLI" | grep -q "Mach-O" || { echo "FAIL: cli not Mach-O"; exit 1; }
          echo "=== PASS: macos-x64 ==="

      - name: Package
        run: |
          STUB=target/release/xbin-stub
          CLI=target/release/xbin
          CRYPTO=target/release/xbin-crypto
          DIR="xbin-macos-x64"
          mkdir -p "${DIR}/bin"
          cp "$STUB" "${DIR}/bin/"
          cp "$CLI" "${DIR}/bin/"
          [ -f "$CRYPTO" ] && cp "$CRYPTO" "${DIR}/bin/" || true
          chmod +x "${DIR}/bin/"*
          tar czf "/tmp/assets/${DIR}.tar.gz" "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-macos-x64
          path: /tmp/assets/*

  # ── Upload to Release ────────────────────────────────────────────────
  publish:
    name: Upload to Release
    needs: [build-linux-x64, build-linux-arm64, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/assets
          pattern: assets-*
          merge-multiple: true

      - name: List files
        run: ls -lh /tmp/assets/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: /tmp/assets/*
