name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Linux musl — stub + CLI
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - i686-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-musl
          - s390x-unknown-linux-musl
          - powerpc64le-unknown-linux-musl
          # Linux gnu — CLI only
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - riscv64gc-unknown-linux-gnu
          # macOS
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          # Windows
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-gnu
          - i686-pc-windows-gnu
          # FreeBSD
          - x86_64-unknown-freebsd
          - aarch64-unknown-freebsd
          # NetBSD / OpenBSD
          - x86_64-unknown-netbsd
          - x86_64-unknown-openbsd
          - i686-unknown-netbsd

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build stub (Linux only — uses /proc/self/exe, namespaces, seccomp)
        if: ${{ contains(matrix.target, 'linux') }}
        run: cargo zigbuild --release --target ${{ matrix.target }} -p xbin-stub

      - name: Build CLI
        run: cargo zigbuild --release --target ${{ matrix.target }} -p xbin-cli

      - name: Package
        shell: bash
        run: |
          DIR="xbin-${{ matrix.target }}"
          mkdir -p "${DIR}/bin"
          if [ -f "target/${{ matrix.target }}/release/xbin.exe" ]; then
            cp "target/${{ matrix.target }}/release/xbin.exe" "${DIR}/bin/"
          else
            cp "target/${{ matrix.target }}/release/xbin" "${DIR}/bin/"
          fi
          if [ -f "target/${{ matrix.target }}/release/xbin-stub" ]; then
            cp "target/${{ matrix.target }}/release/xbin-stub" "${DIR}/bin/"
          fi
          if [ -f "target/${{ matrix.target }}/release/xbin-crypto" ]; then
            cp "target/${{ matrix.target }}/release/xbin-crypto" "${DIR}/bin/"
          fi
          find "${DIR}" -type f -exec chmod +x {} \; 2>/dev/null || true
          tar czf "xbin-${{ matrix.target }}.tar.gz" "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: xbin-${{ matrix.target }}
          path: xbin-${{ matrix.target }}.tar.gz

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/assets
          pattern: xbin-*
          merge-multiple: true

      - run: |
          cd /tmp/assets
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: /tmp/assets/checksums.txt

  publish:
    name: Upload to Release
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/assets
          pattern: xbin-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: /tmp/assets

      - name: List assets
        run: ls -lh /tmp/assets/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: /tmp/assets/*
