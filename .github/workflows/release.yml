name: Release

# Glow-style release pipeline.
#
# On every `v*` tag push, build one archive per platform on its NATIVE
# runner (like goreleaser does for glow), produce checksums.txt, then
# create the GitHub release with all assets.
#
#   xbin_<version>_<os>_<arch>.<ext>
#   xbin_0.4.0_linux_amd64.tar.gz     (xbin + xbin-stub + xbin-crypto)
#   xbin_0.4.0_linux_arm64.tar.gz     (xbin + xbin-stub + xbin-crypto)
#   xbin_0.4.0_darwin_amd64.tar.gz    (xbin only — the stub launcher is Linux-only)
#   xbin_0.4.0_darwin_arm64.tar.gz    (xbin only)
#   checksums.txt
#
# Windows is a work-in-progress port: xbin-core still uses
# std::os::unix::fs::PermissionsExt, so the CLI does not compile there yet.
# The job is kept in the matrix (continue-on-error) as a build tracker; it
# never blocks the release and its artifacts are not published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux amd64 ─────────────────────────────────────────────────────
  linux-amd64:
    name: linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (musl cross C compiler)
        uses: goto-bus-stop/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build (musl static)
        run: |
          cargo zigbuild --release -p xbin-stub --target x86_64-unknown-linux-musl
          cargo zigbuild --release -p xbin-cli --target x86_64-unknown-linux-musl

      - name: Verify
        run: |
          file target/x86_64-unknown-linux-musl/release/xbin-stub
          file target/x86_64-unknown-linux-musl/release/xbin-crypto
          file target/x86_64-unknown-linux-musl/release/xbin

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          T="x86_64-unknown-linux-musl"
          D="xbin_${V}_linux_amd64"
          mkdir -p "${D}"
          cp "target/${T}/release/xbin" "${D}/xbin"
          cp "target/${T}/release/xbin-stub" "${D}/xbin-stub"
          cp "target/${T}/release/xbin-crypto" "${D}/xbin-crypto"
          chmod +x "${D}/"*
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: xbin_*.tar.gz

  # ── Linux arm64 ─────────────────────────────────────────────────────
  linux-arm64:
    name: linux arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (musl cross C compiler)
        uses: goto-bus-stop/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build (musl static, aarch64)
        run: |
          cargo zigbuild --release -p xbin-stub --target aarch64-unknown-linux-musl
          cargo zigbuild --release -p xbin-cli --target aarch64-unknown-linux-musl

      - name: Verify
        run: |
          file target/aarch64-unknown-linux-musl/release/xbin-stub
          file target/aarch64-unknown-linux-musl/release/xbin-crypto
          file target/aarch64-unknown-linux-musl/release/xbin

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          T="aarch64-unknown-linux-musl"
          D="xbin_${V}_linux_arm64"
          mkdir -p "${D}"
          cp "target/${T}/release/xbin" "${D}/xbin"
          cp "target/${T}/release/xbin-stub" "${D}/xbin-stub"
          cp "target/${T}/release/xbin-crypto" "${D}/xbin-crypto"
          chmod +x "${D}/"*
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: xbin_*.tar.gz

  # ── Darwin amd64 (macOS Intel) ──────────────────────────────────────
  darwin-amd64:
    name: darwin amd64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The stub is Linux-only (unshare/pivot_root/seccomp) — build the CLI only.
      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Verify
        run: file target/release/xbin | grep -q "Mach-O"

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="xbin_${V}_darwin_amd64"
          mkdir -p "${D}"
          cp target/release/xbin "${D}/xbin"
          chmod +x "${D}/xbin"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64
          path: xbin_*.tar.gz

  # ── Darwin arm64 (macOS Apple Silicon) ──────────────────────────────
  darwin-arm64:
    name: darwin arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Verify
        run: |
          file target/release/xbin | grep -q "Mach-O"
          file target/release/xbin | grep -q "arm64"

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="xbin_${V}_darwin_arm64"
          mkdir -p "${D}"
          cp target/release/xbin "${D}/xbin"
          chmod +x "${D}/xbin"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: xbin_*.tar.gz

  # ── Windows amd64 (work-in-progress port) ───────────────────────────
  # xbin-core uses std::os::unix::fs::PermissionsExt unconditionally, so
  # this job is EXPECTED to fail until the Windows port lands. It only
  # tracks the build status; it never blocks the release.
  windows-amd64:
    name: windows amd64 (wip)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="xbin_${V}_windows_amd64"
          mkdir -p "${D}"
          cp target/release/xbin.exe "${D}/xbin.exe"
          powershell -Command "Compress-Archive -Path '${D}' -DestinationPath '${D}.zip'"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: xbin_*.zip

  # ── Publish the release with all assets + checksums ─────────────────
  publish:
    name: Publish GitHub release
    needs: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-amd64|*-arm64"
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum xbin_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: List artifacts
        run: ls -lh dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "x.bin $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            dist/xbin_*.tar.gz dist/checksums.txt \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
             dist/xbin_*.tar.gz dist/checksums.txt --clobber
