name: Release

# Glow-style release pipeline.
#
# On every `v*` tag push, build one archive per platform, produce
# checksums.txt, then create the GitHub release with all assets.
#
#   daedalus_<version>_<os>_<arch>.<ext>
#   daedalus_0.5.0_linux_amd64.tar.gz     (daedalus + daedalus-stub + daedalus-crypto)
#   daedalus_0.5.0_linux_arm64.tar.gz     (daedalus + daedalus-stub + daedalus-crypto)
#   daedalus_0.5.0_darwin_amd64.tar.gz    (daedalus + daedalus-stub + daedalus-crypto)
#   daedalus_0.5.0_darwin_arm64.tar.gz    (daedalus + daedalus-stub + daedalus-crypto)
#   daedalus_0.5.0_windows_amd64.tar.gz   (daedalus + daedalus-stub + daedalus-crypto)
#   checksums.txt
#
# Strategy:
#   - All targets cross-compiled from ubuntu with cargo-zigbuild (zig C
#     cross-compiler). Windows via zig's mingw; macOS via zig + a downloaded
#     macOS SDK (SDKROOT) for the Apple frameworks pulled in by ring/sysinfo.
#   - Linux: musl/gnu matrix. amd64 + arm64 musl are the release-critical
#     pair; the other architectures are marked `experimental` so a failure
#     never blocks the release (fail-open expansion, not a gate). The stub
#     (seccomp/landlock) builds only on x86_64/aarch64/i686/armv7/arm — other
#     targets are CLI-only (see ROADMAP.md).
#   - macOS amd64/arm64: CLI + stub (stub has a macos_sandbox Seatbelt port).
#   - Windows amd64: CLI + stub (stub has a win.rs FFI layer).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DAEDALUS_NODE_VERSION: "20.18.0"

jobs:
  # ── Linux (all targets, cross-compiled with zigbuild) ───────────────
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # stub builds only where the seccomp/landlock constants exist:
          # x86_64, aarch64, i686, armv7, arm. Everything else is CLI-only.
          - { target: x86_64-unknown-linux-musl, arch: amd64, stub: true }
          - { target: aarch64-unknown-linux-musl, arch: arm64, stub: true }
          - { target: i686-unknown-linux-musl, arch: i386, stub: true, experimental: true }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7, stub: true, experimental: true }
          - { target: arm-unknown-linux-musleabihf, arch: arm, stub: true, experimental: true }
          - { target: riscv64gc-unknown-linux-musl, arch: riscv64, stub: false, experimental: true }
          - { target: powerpc64le-unknown-linux-musl, arch: ppc64le, stub: false, experimental: true }
          - { target: x86_64-unknown-linux-gnu, arch: amd64-gnu, stub: false, experimental: true }
          - { target: aarch64-unknown-linux-gnu, arch: arm64-gnu, stub: false, experimental: true }
          - { target: i686-unknown-linux-gnu, arch: i386-gnu, stub: false, experimental: true }
          - { target: armv7-unknown-linux-gnueabihf, arch: armv7-gnu, stub: false, experimental: true }
          - { target: riscv64gc-unknown-linux-gnu, arch: riscv64-gnu, stub: false, experimental: true }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (musl cross C compiler)
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build stub (Linux only — uses /proc/self/exe, namespaces, seccomp)
        if: matrix.stub
        run: cargo zigbuild --release --target ${{ matrix.target }} -p daedalus-stub

      - name: Build CLI
        run: cargo zigbuild --release --target ${{ matrix.target }} -p daedalus-cli

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          T="${{ matrix.target }}"
          D="daedalus_${V}_linux_${{ matrix.arch }}"
          mkdir -p "${D}"
          cp "target/${T}/release/daedalus" "${D}/daedalus"
          if [ -f "target/${T}/release/daedalus-stub" ]; then
            cp "target/${T}/release/daedalus-stub" "${D}/daedalus-stub"
          fi
          if [ -f "target/${T}/release/daedalus-crypto" ]; then
            cp "target/${T}/release/daedalus-crypto" "${D}/daedalus-crypto"
          fi
          find "${D}" -type f -exec chmod +x {} +
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: daedalus_*.tar.gz
          if-no-files-found: error

  # ── Darwin amd64 (macOS Intel) ──────────────────────────────────────
  # Cross-compiled on ubuntu via cargo-zigbuild + downloaded macOS SDK.
  # (Native macOS runners were flaky: macos-13 retired Dec 2025, and the
  # jobs failed from day one. The ubuntu zigbuild path is verified green.)
  darwin-amd64:
    name: darwin amd64
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/daedalus-stub-target
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Download macOS SDK
        run: |
          mkdir -p /tmp/macos-sdk
          curl -sL -o /tmp/macos-sdk/sdk.tar.xz \
            https://github.com/roblabla/MacOSX-SDKs/releases/download/13.1/MacOSX13.1.sdk.tar.xz
          tar xf /tmp/macos-sdk/sdk.tar.xz -C /tmp/macos-sdk
          echo "SDKROOT=/tmp/macos-sdk/MacOSX13.1.sdk" >> "$GITHUB_ENV"

      - name: Build stub
        run: cargo zigbuild --release -p daedalus-stub --target x86_64-apple-darwin

      - name: Build CLI
        run: cargo zigbuild --release -p daedalus-cli --target x86_64-apple-darwin

      - name: Verify
        run: |
          file /tmp/daedalus-stub-target/x86_64-apple-darwin/release/daedalus | grep -q "Mach-O"
          file /tmp/daedalus-stub-target/x86_64-apple-darwin/release/daedalus-stub | grep -q "Mach-O"

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="daedalus_${V}_darwin_amd64"
          mkdir -p "${D}"
          cp /tmp/daedalus-stub-target/x86_64-apple-darwin/release/daedalus "${D}/daedalus"
          cp /tmp/daedalus-stub-target/x86_64-apple-darwin/release/daedalus-stub "${D}/daedalus-stub"
          cp /tmp/daedalus-stub-target/x86_64-apple-darwin/release/daedalus-crypto "${D}/daedalus-crypto"
          chmod +x "${D}/daedalus" "${D}/daedalus-stub" "${D}/daedalus-crypto"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v6
        with:
          name: darwin-amd64
          path: daedalus_*.tar.gz

  # ── Darwin arm64 (macOS Apple Silicon) ──────────────────────────────
  darwin-arm64:
    name: darwin arm64
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/daedalus-stub-target
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Download macOS SDK
        run: |
          mkdir -p /tmp/macos-sdk
          curl -sL -o /tmp/macos-sdk/sdk.tar.xz \
            https://github.com/roblabla/MacOSX-SDKs/releases/download/13.1/MacOSX13.1.sdk.tar.xz
          tar xf /tmp/macos-sdk/sdk.tar.xz -C /tmp/macos-sdk
          echo "SDKROOT=/tmp/macos-sdk/MacOSX13.1.sdk" >> "$GITHUB_ENV"

      - name: Build stub
        run: cargo zigbuild --release -p daedalus-stub --target aarch64-apple-darwin

      - name: Build CLI
        run: cargo zigbuild --release -p daedalus-cli --target aarch64-apple-darwin

      - name: Verify
        run: |
          file /tmp/daedalus-stub-target/aarch64-apple-darwin/release/daedalus | grep -q "Mach-O"
          file /tmp/daedalus-stub-target/aarch64-apple-darwin/release/daedalus | grep -q "arm64"
          file /tmp/daedalus-stub-target/aarch64-apple-darwin/release/daedalus-stub | grep -q "Mach-O"
          file /tmp/daedalus-stub-target/aarch64-apple-darwin/release/daedalus-stub | grep -q "arm64"

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="daedalus_${V}_darwin_arm64"
          mkdir -p "${D}"
          cp /tmp/daedalus-stub-target/aarch64-apple-darwin/release/daedalus "${D}/daedalus"
          cp /tmp/daedalus-stub-target/aarch64-apple-darwin/release/daedalus-stub "${D}/daedalus-stub"
          cp /tmp/daedalus-stub-target/aarch64-apple-darwin/release/daedalus-crypto "${D}/daedalus-crypto"
          chmod +x "${D}/daedalus" "${D}/daedalus-stub" "${D}/daedalus-crypto"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v6
        with:
          name: darwin-arm64
          path: daedalus_*.tar.gz

  # ── Windows amd64 ───────────────────────────────────────────────────
  # Cross-compiled on ubuntu via cargo-zigbuild (zig provides the mingw C
  # toolchain; no mingw-w64 install needed). Verified green — daedalus-core and
  # daedalus-cli are Windows-portable and the stub has a win.rs FFI layer.
  windows-amd64:
    name: windows amd64
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/daedalus-stub-target
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build stub
        run: cargo zigbuild --release -p daedalus-stub --target x86_64-pc-windows-gnu

      - name: Build CLI
        run: cargo zigbuild --release -p daedalus-cli --target x86_64-pc-windows-gnu

      - name: Verify
        run: |
          file /tmp/daedalus-stub-target/x86_64-pc-windows-gnu/release/daedalus.exe | grep -q "PE32+"
          file /tmp/daedalus-stub-target/x86_64-pc-windows-gnu/release/daedalus-stub.exe | grep -q "PE32+"

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="daedalus_${V}_windows_amd64"
          mkdir -p "${D}"
          cp /tmp/daedalus-stub-target/x86_64-pc-windows-gnu/release/daedalus.exe "${D}/daedalus.exe"
          cp /tmp/daedalus-stub-target/x86_64-pc-windows-gnu/release/daedalus-stub.exe "${D}/daedalus-stub.exe"
          cp /tmp/daedalus-stub-target/x86_64-pc-windows-gnu/release/daedalus-crypto.exe "${D}/daedalus-crypto.exe"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64
          path: daedalus_*.tar.gz

  # ── Publish the release with all assets + checksums ─────────────────
  publish:
    name: Publish GitHub release
    needs: [linux, darwin-amd64, darwin-arm64, windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum daedalus_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: List artifacts
        run: ls -lh dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "daedalus $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            dist/daedalus_*.tar.gz dist/checksums.txt \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
             dist/daedalus_*.tar.gz dist/checksums.txt --clobber

  # ── QEMU boot test for linux-aarch64 ─────────────────────────────────
  qemu-aarch64:
    name: QEMU aarch64 boot test
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build aarch64 stub + CLI
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p daedalus-stub
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p daedalus-cli
      - name: Build hello-web for aarch64
        run: |
          ./target/aarch64-unknown-linux-musl/release/daedalus build examples/hello-web --target aarch64 -o /tmp/hello-web-aarch64.ere
      - name: Run under QEMU
        timeout-minutes: 10
        run: |
          qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/hello-web-aarch64.ere &
          PID=$!
          sleep 5
          curl -s http://127.0.0.1:8080 | grep -q "Hello" && echo "QEMU boot test passed" || (echo "QEMU boot test failed" && kill $PID && exit 1)
          kill $PID || true
