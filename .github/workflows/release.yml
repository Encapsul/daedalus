name: Release

# Glow-style release pipeline.
#
# On every `v*` tag push, build one archive per platform, produce
# checksums.txt, then create the GitHub release with all assets.
#
#   xbin_<version>_<os>_<arch>.<ext>
#   xbin_0.5.0_linux_amd64.tar.gz     (xbin + xbin-stub)
#   xbin_0.5.0_linux_arm64.tar.gz     (xbin + xbin-stub)
#   xbin_0.5.0_darwin_amd64.tar.gz    (xbin only — the stub launcher is Linux-only)
#   xbin_0.5.0_darwin_arm64.tar.gz    (xbin only)
#   checksums.txt
#
# Strategy:
#   - Linux: cross-built via cargo-zigbuild on ubuntu for every musl/gnu
#     target. amd64 + arm64 musl are the release-critical pair; the other
#     architectures are marked `experimental` so a failure never blocks the
#     release (fail-open expansion, not a gate). The stub (seccomp/landlock)
#     builds only on x86_64/aarch64/i686/armv7/arm — other targets are
#     CLI-only (see ROADMAP.md).
#   - macOS: built on NATIVE runners. amd64 uses `macos-15-intel` (macos-13
#     was retired Dec 2025), arm64 uses `macos-latest`.
#   - Windows: CLI only (the stub is Linux-only). Builds on native runners,
#     artifacts not published yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  XBIN_NODE_VERSION: "20.18.0"

jobs:
  # ── Linux (all targets, cross-compiled with zigbuild) ───────────────
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # stub builds only where the seccomp/landlock constants exist:
          # x86_64, aarch64, i686, armv7, arm. Everything else is CLI-only.
          - { target: x86_64-unknown-linux-musl, arch: amd64, stub: true }
          - { target: aarch64-unknown-linux-musl, arch: arm64, stub: true }
          - { target: i686-unknown-linux-musl, arch: i386, stub: true, experimental: true }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7, stub: true, experimental: true }
          - { target: arm-unknown-linux-musleabihf, arch: arm, stub: true, experimental: true }
          - { target: riscv64gc-unknown-linux-musl, arch: riscv64, stub: false, experimental: true }
          - { target: powerpc64le-unknown-linux-musl, arch: ppc64le, stub: false, experimental: true }
          - { target: x86_64-unknown-linux-gnu, arch: amd64-gnu, stub: false, experimental: true }
          - { target: aarch64-unknown-linux-gnu, arch: arm64-gnu, stub: false, experimental: true }
          - { target: i686-unknown-linux-gnu, arch: i386-gnu, stub: false, experimental: true }
          - { target: armv7-unknown-linux-gnueabihf, arch: armv7-gnu, stub: false, experimental: true }
          - { target: riscv64gc-unknown-linux-gnu, arch: riscv64-gnu, stub: false, experimental: true }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (musl cross C compiler)
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build stub (Linux only — uses /proc/self/exe, namespaces, seccomp)
        if: matrix.stub
        run: cargo zigbuild --release --target ${{ matrix.target }} -p xbin-stub

      - name: Build CLI
        run: cargo zigbuild --release --target ${{ matrix.target }} -p xbin-cli

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          T="${{ matrix.target }}"
          D="xbin_${V}_linux_${{ matrix.arch }}"
          mkdir -p "${D}"
          cp "target/${T}/release/xbin" "${D}/xbin"
          if [ -f "target/${T}/release/xbin-stub" ]; then
            cp "target/${T}/release/xbin-stub" "${D}/xbin-stub"
          fi
          if [ -f "target/${T}/release/xbin-crypto" ]; then
            cp "target/${T}/release/xbin-crypto" "${D}/xbin-crypto"
          fi
          find "${D}" -type f -exec chmod +x {} +
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: xbin_*.tar.gz
          if-no-files-found: error

  # ── Darwin amd64 (macOS Intel) ──────────────────────────────────────
  # macos-13 (the old Intel image) was retired Dec 2025. The official
  # replacement for x86_64 builds is `macos-15-intel`.
  darwin-amd64:
    name: darwin amd64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The stub is Linux-only (unshare/pivot_root/seccomp) — build the CLI only.
      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Verify
        run: file target/release/xbin | grep -q "Mach-O"

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="xbin_${V}_darwin_amd64"
          mkdir -p "${D}"
          cp target/release/xbin "${D}/xbin"
          chmod +x "${D}/xbin"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v6
        with:
          name: darwin-amd64
          path: xbin_*.tar.gz

  # ── Darwin arm64 (macOS Apple Silicon) ──────────────────────────────
  darwin-arm64:
    name: darwin arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Verify
        run: |
          file target/release/xbin | grep -q "Mach-O"
          file target/release/xbin | grep -q "arm64"

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="xbin_${V}_darwin_arm64"
          mkdir -p "${D}"
          cp target/release/xbin "${D}/xbin"
          chmod +x "${D}/xbin"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@v6
        with:
          name: darwin-arm64
          path: xbin_*.tar.gz

  # ── Windows amd64 (work-in-progress port) ───────────────────────────
  # xbin-core uses std::os::unix::fs::PermissionsExt unconditionally, so
  # this job is EXPECTED to fail until the Windows port lands. It only
  # tracks the build status; it never blocks the release.
  windows-amd64:
    name: windows amd64 (wip)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p xbin-cli

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="xbin_${V}_windows_amd64"
          mkdir -p "${D}"
          cp target/release/xbin.exe "${D}/xbin.exe"
          powershell -Command "Compress-Archive -Path '${D}' -DestinationPath '${D}.zip'"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64
          path: xbin_*.zip

  # ── Publish the release with all assets + checksums ─────────────────
  publish:
    name: Publish GitHub release
    needs: [linux, darwin-amd64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: xbin_*.tar.gz
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum xbin_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: List artifacts
        run: ls -lh dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "x.bin $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            dist/xbin_*.tar.gz dist/checksums.txt \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
             dist/xbin_*.tar.gz dist/checksums.txt --clobber

  # ── QEMU boot test for linux-aarch64 ─────────────────────────────────
  qemu-aarch64:
    name: QEMU aarch64 boot test
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build aarch64 stub + CLI
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p xbin-stub
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p xbin-cli
      - name: Build hello-web for aarch64
        run: |
          ./target/release/xbin build examples/hello-web --target aarch64 -o /tmp/hello-web-aarch64.xbin
      - name: Run under QEMU
        run: |
          qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/hello-web-aarch64.xbin &
          PID=$!
          sleep 5
          curl -s http://127.0.0.1:3000 | grep -q "Hello" && echo "QEMU boot test passed" || (echo "QEMU boot test failed" && kill $PID && exit 1)
          kill $PID || true
