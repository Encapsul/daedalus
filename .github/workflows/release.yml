name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────
  linux-x64:
    name: Build linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: stub

      - name: Test binary
        run: |
          STUB=stub/target/x86_64-unknown-linux-musl/release/xbin-stub
          CRYPTO=stub/target/x86_64-unknown-linux-musl/release/xbin-crypto

          file "$STUB" | grep -q "ELF" || { echo "FAIL: not ELF"; exit 1; }
          file "$STUB" | grep -q "x86-64" || { echo "FAIL: not x86_64"; exit 1; }
          "$STUB" --help 2>/dev/null || true
          echo "=== PASS: linux-x64 ==="

      - name: Package
        run: |
          STUB=stub/target/x86_64-unknown-linux-musl/release/xbin-stub
          CRYPTO=stub/target/x86_64-unknown-linux-musl/release/xbin-crypto
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="xbin-linux-x64"
          mkdir -p "${DIR}/bin" "${DIR}/lib/python/xbin"
          cp "$STUB" "${DIR}/bin/"
          cp "$CRYPTO" "${DIR}/bin/"
          cp -r cli/xbin/* "${DIR}/lib/python/xbin/"

          cat > "${DIR}/bin/xbin" << 'WRAPPER'
#!/usr/bin/env bash
XBIN_HOME="$(cd "$(dirname "$0")/.." && pwd)"
export PYTHONPATH="${XBIN_HOME}/lib/python:${PYTHONPATH:-}"
exec python3 -m xbin "$@"
WRAPPER
          chmod +x "${DIR}/bin/xbin"

          tar czf "${DIR}.tar.gz" "${DIR}"
          echo "ASSET=${DIR}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: xbin-*.tar.gz

  # ── Linux aarch64 ────────────────────────────────────────────────────
  linux-arm64:
    name: Build linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-musl
        working-directory: stub
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

      - name: Test binary
        run: |
          STUB=stub/target/aarch64-unknown-linux-musl/release/xbin-stub
          file "$STUB" | grep -q "ELF" || { echo "FAIL: not ELF"; exit 1; }
          file "$STUB" | grep -q "aarch64" || { echo "FAIL: not aarch64"; exit 1; }
          echo "=== PASS: linux-arm64 ==="

      - name: Test QEMU
        run: |
          sudo apt-get install -y qemu-user-static || true
          STUB=stub/target/aarch64-unknown-linux-musl/release/xbin-stub
          qemu-aarch64-static "$STUB" --help 2>/dev/null && echo "OK: QEMU pass" || echo "OK: QEMU exit != 0 is fine"

      - name: Package
        run: |
          STUB=stub/target/aarch64-unknown-linux-musl/release/xbin-stub
          CRYPTO=stub/target/aarch64-unknown-linux-musl/release/xbin-crypto
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="xbin-linux-arm64"
          mkdir -p "${DIR}/bin" "${DIR}/lib/python/xbin"
          cp "$STUB" "${DIR}/bin/"
          cp "$CRYPTO" "${DIR}/bin/"
          cp -r cli/xbin/* "${DIR}/lib/python/xbin/"

          cat > "${DIR}/bin/xbin" << 'WRAPPER'
#!/usr/bin/env bash
XBIN_HOME="$(cd "$(dirname "$0")/.." && pwd)"
export PYTHONPATH="${XBIN_HOME}/lib/python:${PYTHONPATH:-}"
exec python3 -m xbin "$@"
WRAPPER
          chmod +x "${DIR}/bin/xbin"

          tar czf "${DIR}.tar.gz" "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: xbin-*.tar.gz

  # ── macOS Apple Silicon ──────────────────────────────────────────────
  macos-arm64:
    name: Build macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: stub

      - name: Test binary
        run: |
          STUB=stub/target/aarch64-apple-darwin/release/xbin-stub
          file "$STUB" | grep -q "Mach-O" || { echo "FAIL: not Mach-O"; exit 1; }
          file "$STUB" | grep -q "arm64" || { echo "FAIL: not arm64"; exit 1; }
          "$STUB" --help 2>/dev/null || true
          echo "=== PASS: macos-arm64 ==="

      - name: Package
        run: |
          STUB=stub/target/aarch64-apple-darwin/release/xbin-stub
          CRYPTO=stub/target/aarch64-apple-darwin/release/xbin-crypto
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="xbin-macos-arm64"
          mkdir -p "${DIR}/bin" "${DIR}/lib/python/xbin"
          cp "$STUB" "${DIR}/bin/"
          cp "$CRYPTO" "${DIR}/bin/"
          cp -r cli/xbin/* "${DIR}/lib/python/xbin/"

          cat > "${DIR}/bin/xbin" << 'WRAPPER'
#!/usr/bin/env bash
XBIN_HOME="$(cd "$(dirname "$0")/.." && pwd)"
export PYTHONPATH="${XBIN_HOME}/lib/python:${PYTHONPATH:-}"
exec python3 -m xbin "$@"
WRAPPER
          chmod +x "${DIR}/bin/xbin"

          tar czf "${DIR}.tar.gz" "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: xbin-*.tar.gz

  # ── macOS Intel ──────────────────────────────────────────────────────
  macos-x64:
    name: Build macos-x64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin
        working-directory: stub

      - name: Test binary
        run: |
          STUB=stub/target/x86_64-apple-darwin/release/xbin-stub
          file "$STUB" | grep -q "Mach-O" || { echo "FAIL: not Mach-O"; exit 1; }
          file "$STUB" | grep -q "x86_64" || { echo "FAIL: not x86_64"; exit 1; }
          "$STUB" --help 2>/dev/null || true
          echo "=== PASS: macos-x64 ==="

      - name: Package
        run: |
          STUB=stub/target/x86_64-apple-darwin/release/xbin-stub
          CRYPTO=stub/target/x86_64-apple-darwin/release/xbin-crypto
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="xbin-macos-x64"
          mkdir -p "${DIR}/bin" "${DIR}/lib/python/xbin"
          cp "$STUB" "${DIR}/bin/"
          cp "$CRYPTO" "${DIR}/bin/"
          cp -r cli/xbin/* "${DIR}/lib/python/xbin/"

          cat > "${DIR}/bin/xbin" << 'WRAPPER'
#!/usr/bin/env bash
XBIN_HOME="$(cd "$(dirname "$0")/.." && pwd)"
export PYTHONPATH="${XBIN_HOME}/lib/python:${PYTHONPATH:-}"
exec python3 -m xbin "$@"
WRAPPER
          chmod +x "${DIR}/bin/xbin"

          tar czf "${DIR}.tar.gz" "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: xbin-*.tar.gz

  # ── GitHub Release ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [linux-x64, linux-arm64, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -name '*.tar.gz' | sort
          ls -lh artifacts/

      - name: Generate SHASUMS256.txt
        run: |
          cd artifacts
          : > SHASUMS256.txt
          for f in xbin-*.tar.gz; do
            [ -f "$f" ] && sha256sum "$f"
          done >> SHASUMS256.txt
          echo "=== SHASUMS ==="
          cat SHASUMS256.txt

      - name: Write release body
        run: |
          cat > release-body.md << 'EOF'
          ## x.bin — Package any app into a single executable

          **Supported runtimes:** Python, Node.js, Deno, Java, Ruby, .NET/C#, Go, PHP, Perl, Binary, Hugo

          ### Quick install
          ```bash
          curl -fsSL https://raw.githubusercontent.com/Tednoob17/x.bin/main/scripts/install.sh | bash
          ```

          ### Verify checksums
          ```bash
          sha256sum -c SHASUMS256.txt
          ```
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=""
          for f in artifacts/xbin-*.tar.gz; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done
          [ -f "artifacts/SHASUMS256.txt" ] && ASSETS="$ASSETS artifacts/SHASUMS256.txt"

          echo "Uploading:$ASSETS"

          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "x.bin ${GITHUB_REF_NAME}" \
            --notes-file release-body.md \
            $ASSETS

          echo "=== Release published ==="
