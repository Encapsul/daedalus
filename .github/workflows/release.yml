name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────
  linux-x64:
    name: Build linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub

      - name: Build Rust stubs
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: stub

      - name: Package CLI bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="xbin-linux-x64"
          mkdir -p "${DIR}/bin"
          mkdir -p "${DIR}/lib/python/xbin"

          # Rust stubs
          cp stub/target/x86_64-unknown-linux-musl/release/xbin-stub "${DIR}/bin/"
          cp stub/target/x86_64-unknown-linux-musl/release/xbin-crypto "${DIR}/bin/"

          # Python CLI package
          cp -r cli/xbin/* "${DIR}/lib/python/xbin/"

          # Create xbin wrapper script
          cat > "${DIR}/bin/xbin" << 'WRAPPER'
          #!/usr/bin/env bash
          XBIN_HOME="$(cd "$(dirname "$0")/.." && pwd)"
          export PYTHONPATH="${XBIN_HOME}/lib/python:${PYTHONPATH:-}"
          exec python3 -m xbin "$@"
          WRAPPER
          chmod +x "${DIR}/bin/xbin"

          tar czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "ASSET=${DIR}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${DIR}.tar.gz.sha256" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-checksum
          path: ${{ env.CHECKSUM }}

  # ── Linux aarch64 ────────────────────────────────────────────────────
  linux-arm64:
    name: Build linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Rust stubs
        run: cargo build --release --target aarch64-unknown-linux-musl
        working-directory: stub
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

      - name: Package CLI bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="xbin-linux-arm64"
          mkdir -p "${DIR}/bin"
          mkdir -p "${DIR}/lib/python/xbin"

          cp stub/target/aarch64-unknown-linux-musl/release/xbin-stub "${DIR}/bin/"
          cp stub/target/aarch64-unknown-linux-musl/release/xbin-crypto "${DIR}/bin/"

          cp -r cli/xbin/* "${DIR}/lib/python/xbin/"

          cat > "${DIR}/bin/xbin" << 'WRAPPER'
          #!/usr/bin/env bash
          XBIN_HOME="$(cd "$(dirname "$0")/.." && pwd)"
          export PYTHONPATH="${XBIN_HOME}/lib/python:${PYTHONPATH:-}"
          exec python3 -m xbin "$@"
          WRAPPER
          chmod +x "${DIR}/bin/xbin"

          tar czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "ASSET=${DIR}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${DIR}.tar.gz.sha256" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-checksum
          path: ${{ env.CHECKSUM }}

  # ── macOS aarch64 (Apple Silicon) ────────────────────────────────────
  macos-arm64:
    name: Build macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub

      - name: Build Rust stubs
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: stub

      - name: Package CLI bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="xbin-macos-arm64"
          mkdir -p "${DIR}/bin"
          mkdir -p "${DIR}/lib/python/xbin"

          cp stub/target/aarch64-apple-darwin/release/xbin-stub "${DIR}/bin/"
          cp stub/target/aarch64-apple-darwin/release/xbin-crypto "${DIR}/bin/"

          cp -r cli/xbin/* "${DIR}/lib/python/xbin/"

          cat > "${DIR}/bin/xbin" << 'WRAPPER'
          #!/usr/bin/env bash
          XBIN_HOME="$(cd "$(dirname "$0")/.." && pwd)"
          export PYTHONPATH="${XBIN_HOME}/lib/python:${PYTHONPATH:-}"
          exec python3 -m xbin "$@"
          WRAPPER
          chmod +x "${DIR}/bin/xbin"

          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "ASSET=${DIR}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${DIR}.tar.gz.sha256" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-checksum
          path: ${{ env.CHECKSUM }}

  # ── macOS x86_64 (Intel) ─────────────────────────────────────────────
  macos-x64:
    name: Build macos-x64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub

      - name: Build Rust stubs
        run: cargo build --release --target x86_64-apple-darwin
        working-directory: stub

      - name: Package CLI bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="xbin-macos-x64"
          mkdir -p "${DIR}/bin"
          mkdir -p "${DIR}/lib/python/xbin"

          cp stub/target/x86_64-apple-darwin/release/xbin-stub "${DIR}/bin/"
          cp stub/target/x86_64-apple-darwin/release/xbin-crypto "${DIR}/bin/"

          cp -r cli/xbin/* "${DIR}/lib/python/xbin/"

          cat > "${DIR}/bin/xbin" << 'WRAPPER'
          #!/usr/bin/env bash
          XBIN_HOME="$(cd "$(dirname "$0")/.." && pwd)"
          export PYTHONPATH="${XBIN_HOME}/lib/python:${PYTHONPATH:-}"
          exec python3 -m xbin "$@"
          WRAPPER
          chmod +x "${DIR}/bin/xbin"

          tar czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "ASSET=${DIR}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${DIR}.tar.gz.sha256" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-checksum
          path: ${{ env.CHECKSUM }}

  # ── GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish release
    needs: [linux-x64, linux-arm64, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md << NOTES
          ## What's New

          - Improved CLI packaging with full Python runtime support
          - Updated installation script

          ## Install

          ### Linux / macOS

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
          \`\`\`

          Or download manually from the assets below.

          ### From source

          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git
          cd x.bin
          make preflight && make stub && make install
          \`\`\`
          NOTES

          # Append checksums
          echo "" >> release-notes.md
          echo "## Checksums" >> release-notes.md
          echo '```' >> release-notes.md
          cat artifacts/*.sha256 >> release-notes.md
          echo '```' >> release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          draft: false
          prerelease: false
