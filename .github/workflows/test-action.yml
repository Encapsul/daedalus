name: Test erebus Action

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/actions/erebus-build/**'

jobs:
  test-action:
    name: Test erebus-build action
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/erebus-stub-target
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zstd pkg-config libssl-dev python3

      - name: Build stub (musl static ELF)
        run: make stub

      # Build and install erebus so the action can find it
      - name: Build erebus from source
        run: |
          cargo build --release -p erebus-cli
          /tmp/erebus-stub-target/release/erebus --version

      # Create a minimal test app
      - name: Create test app
        run: |
          mkdir -p /tmp/test-app
          cat > /tmp/test-app/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Test</title></head>
          <body><h1>Hello from erebus action!</h1></body>
          </html>
          EOF

      # Test the action
      - name: Build test binary with action
        uses: ./.github/actions/erebus-build
        id: erebus
        with:
          app-path: '/tmp/test-app'
          output: '/tmp/test-app.ere'

      # Verify output
      - name: Verify output
        run: |
          echo "Binary path: ${{ steps.erebus.outputs.binary-path }}"
          echo "Runtime: ${{ steps.erebus.outputs.runtime }}"
          echo "Size: ${{ steps.erebus.outputs.size }}"

          test -f "${{ steps.erebus.outputs.binary-path }}" || {
            echo "ERROR: binary not found"
            exit 1
          }

          echo "PASS: binary exists"

      # Upload artifact
      - uses: actions/upload-artifact@v6
        with:
          name: test-binary
          path: /tmp/test-app.ere
