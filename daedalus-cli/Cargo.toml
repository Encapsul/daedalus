[package]
name = "daedalus-cli"
version = "0.7.0"
edition = "2021"
description = "daedalus CLI — package any app into a single self-extracting binary"

[[bin]]
name = "daedalus"
path = "src/main.rs"

[dependencies]
daedalus-core = { path = "../daedalus-core" }
clap = { version = "4", features = ["derive", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "std", "rand_core", "zeroize"] }
zeroize = "1"
rand = "0.8"
tempfile = "3"
walkdir = "2"
which = "7"
hex = "0.4"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
anyhow = "1"
human-panic = "2"
clap_complete = "4"
clap_mangen = "0.2"
tar = "0.4"
xz2 = "0.1"
zip = "2"
flate2 = "1"
libc = "0.2"
crossterm = "0.28"
ratatui = "0.30"
urlencoding = "2"
lru = "0.16.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
zstd = "0.13"
tar = "0.4"

[lints]
workspace = true
