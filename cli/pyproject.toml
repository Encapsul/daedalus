[project]
name = "xbin"
version = "0.1.0"
description = "Ship your web app like a binary. Run anywhere."
requires-python = ">=3.10"
dependencies = []  # MVP: stdlib only

[project.scripts]
xbin = "xbin.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["xbin*"]

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade (modern syntax)
    "B",     # flake8-bugbear (common bugs)
    "SIM",   # flake8-simplify (flatten nesting, etc.)
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line too long — Black handles wrapping; long strings are fine
]

[tool.ruff.lint.isort]
known-first-party = ["xbin"]
