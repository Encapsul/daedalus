[project]
name = "xbin-legacy"
version = "0.0.1"
description = "DEPRECATED: Legacy Python CLI. Use the Rust CLI (xbin-cli crate) instead."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
encrypt = ["cryptography>=49.0.0"]

[project.scripts]
xbin-legacy = "xbin.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["xbin*"]