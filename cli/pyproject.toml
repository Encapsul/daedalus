[project]
name = "xbin"
version = "0.1.0"
description = "Ship your web app like a binary. Run anywhere."
requires-python = ">=3.10"
dependencies = []  # core: stdlib only

[project.optional-dependencies]
encrypt = ["cryptography>=41.0"]   # needed for --encrypt (AES-256-GCM)
python310 = ["tomli>=2.0"]         # tomllib is stdlib in 3.11+, needed as fallback for 3.10
dev = ["ruff>=0.1", "black>=24.0"] # linting and formatting
all = ["xbin[encrypt,python310,dev]"]

[project.scripts]
xbin = "xbin.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["xbin*"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade (modern syntax)
    "B",     # flake8-bugbear (common bugs)
    "SIM",   # flake8-simplify (flatten nesting, etc.)
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line too long — Black handles wrapping; long strings are fine
]

[tool.ruff.lint.isort]
known-first-party = ["xbin"]
