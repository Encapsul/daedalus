[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "xbin-core"
version = "0.1.0"
description = "x.bin core library — format, compression, runtime detection, package manager detection"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
features = ["python"]
module-name = "xbin_core"
