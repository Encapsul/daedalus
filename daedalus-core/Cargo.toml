[package]
name = "daedalus-core"
version = "0.6.1"
edition = "2021"
description = "daedalus core library — format, compression, runtime detection, package manager detection"

[lib]
name = "daedalus_core"
path = "src/lib.rs"

[features]
default = []
python = ["pyo3"]

[dependencies]
# Format + integrity
sha2 = { version = "0.10", features = ["compress"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Compression
ruzstd = "0.7"          # zstd decompression (pure Rust, for reading)
zstd = { version = "0.13", features = ["zstdmt"] }  # zstd compression (multithreaded)

# Tar archive creation
tar = "0.4"
flate2 = "1"

# Encryption
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
anyhow = "1"
# Secret material cleanup: Zeroizing<..> drops zero the AES key/nonce on scope exit.
zeroize = "1"

# Path utilities
pathdiff = "0.2"
which = "7"

# Hex encoding
hex = "0.4"

# SISR manifest signing (Ed25519, zeroize on drop).
# Pinned >= 2.1.0 for CVE-2023-48022 (Ed25519 bit must be set).
ed25519-dalek = "2.1"

# Constant-time byte comparison for verification digests
subtle = "2"

# TOML parsing for pyproject.toml
toml = "0.8"

# Secret detection in .env files
regex = "1"

# Timestamp formatting
time = { version = "0.3", features = ["formatting"] }

# Temporary files for extension downloads
tempfile = "3"

# Python bindings (optional)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

# Error handling
thiserror = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
