[book]
title = "x.bin"
description = "Ship your web app like a binary. Run anywhere."
authors = ["Tednoob17"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Tednoob17/x.bin"
edit-url-template = "https://github.com/Tednoob17/x.bin/edit/main/docs/src/{path}"


[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
