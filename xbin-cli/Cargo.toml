[package]
name = "xbin-cli"
version = "0.1.0"
edition = "2021"
description = "xbin CLI — package any app into a single self-extracting binary"

[[bin]]
name = "xbin"
path = "src/main.rs"

[dependencies]
xbin-core = { path = "../xbin-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "std", "rand_core"] }
rand = "0.8"
tempfile = "3"
walkdir = "2"
toml = "0.8"
which = "7"
hex = "0.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "warn"
unwrap_used = "allow"
expect_used = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
items_after_statements = "allow"
format_push_string = "allow"
uninlined_format_args = "allow"
if_not_else = "allow"
manual_let_else = "allow"
io_other_error = "allow"
map_unwrap_or = "allow"
unnecessary_wraps = "allow"
single_match_else = "allow"
similar_names = "allow"
too_many_lines = "allow"
